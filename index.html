<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Имя Фамилия — разработка ПО, веб и AI-автоматизация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#E6EAEE; --bg2:#D9DFE5; --surface:rgba(244,246,248,.94); --surface-solid:#F3F5F7;
  --ink:#16202B; --muted:#48525F; --line:rgba(22,32,43,.12); --line-strong:rgba(22,32,43,.3);
  --brass:#936A1E; --verd:#1C7B69; --brass-soft:rgba(147,106,30,.12); --verd-soft:rgba(28,123,105,.12);
  --grid:rgba(22,32,43,.05); --gear-fill:rgba(22,32,43,.035); --gear-stroke:rgba(22,32,43,.14);
  --sh:#1A222C; --sh-ink:#E4E9EE; --danger:#B8412B;
  --shadow:0 24px 60px -24px rgba(22,32,43,.35);
  --bit:28,123,105;
  --k-java:147,106,30; --k-back:44,98,146; --k-web:182,58,102; --k-ai:118,76,156; --k-auto:28,123,105;
  --nav-h:78px;
  --ease:cubic-bezier(.76,0,.24,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:'Tektur','Russo One','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --bg2:#161D26; --surface:rgba(22,29,38,.93); --surface-solid:#18202A;
    --ink:#E4E9EE; --muted:#A0ABB8; --line:rgba(160,190,200,.12); --line-strong:rgba(160,190,200,.28);
    --brass:#D4A24C; --verd:#5CC7B0; --brass-soft:rgba(212,162,76,.13); --verd-soft:rgba(92,199,176,.12);
    --grid:rgba(160,190,200,.04); --gear-fill:rgba(212,162,76,.03); --gear-stroke:rgba(212,162,76,.2);
    --sh:#0C1117; --danger:#F07A5C;
    --shadow:0 30px 80px -30px rgba(0,0,0,.85);
    --bit:92,199,176;
    --k-java:212,162,76; --k-back:108,166,222; --k-web:238,120,160; --k-ai:178,146,226; --k-auto:92,199,176;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --bg2:#161D26; --surface:rgba(22,29,38,.93); --surface-solid:#18202A;
  --ink:#E4E9EE; --muted:#A0ABB8; --line:rgba(160,190,200,.12); --line-strong:rgba(160,190,200,.28);
  --brass:#D4A24C; --verd:#5CC7B0; --brass-soft:rgba(212,162,76,.13); --verd-soft:rgba(92,199,176,.12);
  --grid:rgba(160,190,200,.04); --gear-fill:rgba(212,162,76,.03); --gear-stroke:rgba(212,162,76,.2);
  --sh:#0C1117; --danger:#F07A5C;
  --shadow:0 30px 80px -30px rgba(0,0,0,.85);
  --bit:92,199,176;
  --k-java:212,162,76; --k-back:108,166,222; --k-web:238,120,160; --k-ai:178,146,226; --k-auto:92,199,176;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px dashed var(--verd);outline-offset:3px}
.mono{font-family:var(--f-mono)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ============ BACKGROUND MACHINERY ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1100px 700px at 12% 8%,var(--brass-soft),transparent 60%),
             radial-gradient(900px 640px at 92% 92%,var(--verd-soft),transparent 60%),var(--bg)}
.bg::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
#binary,#circuits,#gears{position:absolute;inset:0;width:100%;height:100%}
#binary{opacity:.28;-webkit-mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%);mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%)}
#circuits{opacity:.75;-webkit-mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%);mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%)}
#circuits .trace{fill:none;stroke:var(--line);stroke-width:1.2}
#circuits .via{fill:var(--bg);stroke:var(--line-strong);stroke-width:1.2}
#circuits .pulse{fill:none;stroke:var(--verd);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:16 9999;animation:pulse var(--dur,6s) linear infinite;animation-delay:var(--del,0s);filter:drop-shadow(0 0 4px var(--verd))}
@keyframes pulse{from{stroke-dashoffset:16px}to{stroke-dashoffset:calc(var(--len) * -1px)}}
#gears .gear{fill:var(--gear-fill);stroke:var(--gear-stroke);stroke-width:1.2}
#gears .gear-v{stroke:rgba(var(--bit),.28)}
#gears .deco{fill:none;stroke:var(--gear-stroke);stroke-width:1}
#gears .deco-d{fill:none;stroke:var(--gear-stroke);stroke-width:1;stroke-dasharray:3 6}

/* ============ NAV ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px)}
.nav::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 35%,transparent);pointer-events:none}
.nav-inner{position:relative;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(16px,3vw,44px)}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px}
.logo svg{width:36px;height:36px;color:var(--brass)}
.logo b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;display:block;line-height:1.1}
.logo small{font-size:11.5px;color:var(--muted);display:block}
.menu{position:relative;display:flex;gap:2px;padding-bottom:22px;margin-bottom:-14px}
.menu button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:7px;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);transition:color .3s;border-radius:4px}
.menu button .n{font-family:var(--f-mono);font-size:10.5px;color:var(--brass)}
.menu button:hover,.menu button.active{color:var(--ink)}
.menu button:focus-visible{outline:1.5px dashed var(--verd)}
.rack{position:absolute;left:8px;right:8px;bottom:4px;height:6px;border-top:1px solid var(--line-strong);
  background:repeating-linear-gradient(90deg,var(--line-strong) 0 3px,transparent 3px 8px)}
.roller{position:absolute;left:0;bottom:10px;width:20px;height:20px;color:var(--brass);transition:transform 1s var(--ease);will-change:transform}
.roller svg{width:100%;height:100%;display:block}
.menu-glow{position:absolute;bottom:4px;left:0;height:2px;background:var(--verd);box-shadow:0 0 10px var(--verd);transition:transform 1s var(--ease),width 1s var(--ease);transform-origin:left}
.nav-cta{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:1px solid var(--line-strong);border-radius:40px;font-weight:600;font-size:14px;transition:border-color .3s,background .3s}
.nav-cta svg{width:22px;height:22px;color:var(--brass)}
.nav-cta:hover{border-color:var(--brass);background:var(--brass-soft)}

/* ============ HUD ============ */
.hud{position:fixed;z-index:40;color:var(--muted);font-size:12px}
.hud-l{left:clamp(16px,3vw,44px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:14px}
.hud-l .num{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink);line-height:1;min-width:1.6em}
.hud-l .of{font-family:var(--f-mono);font-size:11px}
.hud-l .name{padding-left:14px;border-left:1px solid var(--line-strong)}
.hud-r{right:clamp(10px,1.6vw,26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;align-items:flex-end}
.hud-r button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px}
.hud-r .bits{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);opacity:0;transform:translateX(8px);transition:.4s var(--ease-out)}
.hud-r button:hover .bits,.hud-r button.active .bits{opacity:1;transform:none}
.hud-r button.active .bits{color:var(--verd)}
.hud-r .pip{width:9px;height:9px;border:1px solid var(--line-strong);transform:rotate(45deg);transition:.4s}
.hud-r button.active .pip{background:var(--verd);border-color:var(--verd);box-shadow:0 0 12px var(--verd)}
.scroll-hint{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);transition:opacity .5s}
.scroll-hint i{width:18px;height:28px;border:1.5px solid var(--line-strong);border-radius:10px;position:relative}
.scroll-hint i::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:6px;margin-left:-1.5px;border-radius:2px;background:var(--verd);animation:wheel 1.8s var(--ease-out) infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(9px);opacity:0}100%{opacity:0}}
body.not-first .scroll-hint{opacity:0}

/* ============ STAGE / SLIDES ============ */
.stage{position:fixed;inset:0;z-index:10}
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto}
.slide-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 14px) clamp(20px,6vw,110px) calc(env(safe-area-inset-bottom,0px) + 70px);
  display:flex;flex-direction:column;justify-content:center}
.slide-scroll::-webkit-scrollbar{display:none}
.wrap{width:100%;max-width:1320px;margin:0 auto}
.ghost-num{position:absolute;right:clamp(10px,4vw,70px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--f-display);font-weight:800;font-size:clamp(120px,22vw,300px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none;z-index:-1}

/* entrance choreography (on wrappers only) */
[data-a]{opacity:0}
.slide.in [data-a]{animation:var(--anim,a-up) .95s var(--ease-out) both;animation-delay:calc(var(--d,0) * 90ms + 40ms)}
[data-a="left"]{--anim:a-left}[data-a="right"]{--anim:a-right}[data-a="scale"]{--anim:a-scale}[data-a="clip"]{--anim:a-clip}[data-a="fade"]{--anim:a-fade}
@keyframes a-up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes a-left{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes a-right{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes a-scale{from{opacity:0;transform:scale(.8) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes a-clip{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes a-fade{from{opacity:0}to{opacity:1}}

.s-head{margin-bottom:clamp(18px,3vh,34px)}
.s-meta{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.s-meta .idx{font-family:var(--f-mono);color:var(--brass);font-size:12px}
.s-meta .bitline{font-family:var(--f-mono);font-size:10.5px;color:rgba(var(--bit),.6);letter-spacing:.18em;white-space:nowrap;overflow:hidden;max-width:220px}
.s-title{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.8vw,54px);line-height:1.02;margin:0;letter-spacing:-.01em}
.s-sub{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:15px}

/* ============ BUTTONS ============ */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:40px;font-weight:600;font-size:14.5px;transition:background .3s,color .3s,border-color .3s,box-shadow .3s;position:relative}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 0 0 4px var(--brass-soft),0 12px 30px -10px var(--brass)}
.btn-primary svg{color:var(--brass)}
.btn-ghost{border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--verd);color:var(--verd)}
.magnetic{transition:transform .35s var(--ease-out),background .3s,color .3s,border-color .3s,box-shadow .3s}

/* ============ 1. ABOUT ============ */
.hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(26px,5vw,90px);align-items:center}
.portrait-w{display:grid;place-items:center}
.portrait{--s:min(calc(100vh - 230px),34vw,470px);width:var(--s);height:var(--s);position:relative;perspective:900px}
.portrait-tilt{position:absolute;inset:0;transition:transform .3s ease-out;transform-style:preserve-3d}
.portrait svg.ring,.portrait svg.ticks{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.portrait svg.ring .rg{fill:var(--surface-solid);stroke:var(--brass);stroke-width:1.3}
.portrait svg.ticks{inset:7%;width:86%;height:86%;color:var(--line-strong)}
.photo{position:absolute;inset:17%;border-radius:50%;overflow:hidden;border:1px solid var(--line-strong);
  background:radial-gradient(circle at 50% 30%,var(--bg2),var(--surface-solid) 70%);box-shadow:inset 0 0 40px rgba(0,0,0,.15)}
.photo:has(img){background:#fff}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.photo .scan{position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(to bottom,transparent,rgba(var(--bit),.18) 85%,rgba(var(--bit),.6));animation:scan 4s var(--ease) infinite}
@keyframes scan{0%{top:-40%}60%,100%{top:110%}}
.orbit{position:absolute;inset:3%;border-radius:50%;animation:orbit 14s linear infinite;pointer-events:none}
.orbit.o2{inset:-4%;animation-duration:22s;animation-direction:reverse}
.orbit.o3{inset:10%;animation-duration:9s}
.orbit span{position:absolute;top:-9px;left:50%;margin-left:-8px;width:16px;height:18px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--verd);background:var(--bg);border:1px solid var(--verd-soft);border-radius:3px}
.orbit.o2 span{color:var(--brass);border-color:var(--brass-soft)}
@keyframes orbit{to{transform:rotate(360deg)}}
.callout{position:absolute;display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 12px;border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:30px;white-space:nowrap}
.callout .led{width:7px;height:7px;border-radius:50%;background:var(--verd);box-shadow:0 0 8px var(--verd);animation:blink 2s infinite}
.callout.c1{top:6%;right:-6%}
.callout.c2{bottom:9%;left:-8%}
@keyframes blink{50%{opacity:.35}}

.hero-name{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6.4vw,96px);line-height:.92;margin:0;letter-spacing:-.02em}
.hero-name .l2{display:block;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.typer{margin:18px 0 0;font-family:var(--f-mono);font-size:clamp(14px,1.3vw,17px);color:var(--verd);min-height:1.6em}
.typer .caret{display:inline-block;width:9px;height:1.1em;vertical-align:-3px;background:var(--verd);margin-left:3px;animation:blink 1s steps(1) infinite}
.lead{color:var(--muted);font-size:clamp(14.5px,1.15vw,16.5px);max-width:52ch;margin:14px 0 0}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:30px 0 26px}
.chip{position:relative;padding:16px 14px 14px;border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:6px;cursor:pointer;transition:transform .45s var(--ease-out),border-color .3s,box-shadow .3s;outline-offset:4px}
.chip::before,.chip::after{content:"";position:absolute;left:16px;right:16px;height:6px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 4px,transparent 4px 10px);transition:background .3s}
.chip::before{top:-7px}.chip::after{bottom:-7px}
.chip:hover,.chip.open,.chip:focus-visible{transform:translateY(-4px);border-color:var(--verd);box-shadow:0 18px 40px -20px var(--verd);z-index:6}
.chip:hover::before,.chip:hover::after,.chip.open::before,.chip.open::after{background:repeating-linear-gradient(90deg,var(--verd) 0 4px,transparent 4px 10px)}
.chip-ic{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;color:var(--brass);margin-bottom:12px;position:relative}
.chip-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chip h4{font-size:14.5px;margin:0;font-weight:700;line-height:1.25}
.chip .more{font-size:12px;color:var(--muted);margin-top:4px}
.chip-drawer{position:absolute;left:-1px;right:-1px;top:calc(100% + 12px);padding:13px 14px;background:var(--surface-solid);border:1px solid var(--verd);border-radius:6px;font-size:13px;line-height:1.5;color:var(--muted);clip-path:inset(0 0 100% 0);opacity:0;transform:translateY(-8px);transition:clip-path .55s var(--ease-out),opacity .3s,transform .55s var(--ease-out);pointer-events:none;box-shadow:var(--shadow)}
.chip:hover .chip-drawer,.chip.open .chip-drawer,.chip:focus-visible .chip-drawer{clip-path:inset(-20px -20px -20px -20px);opacity:1;transform:none}
.hero-foot{display:flex;flex-wrap:wrap;align-items:center;gap:18px 36px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.stats{display:flex;gap:28px}
.stat b{font-family:var(--f-display);font-weight:800;font-size:26px;display:block;line-height:1}
.stat span{font-size:12px;color:var(--muted)}

/* ============ 2. JOURNEY ============ */
.bus{position:relative}
.bus-line{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line-strong);overflow:hidden}
.bus-line::after{content:"";position:absolute;top:0;height:2px;width:180px;background:linear-gradient(90deg,transparent,var(--verd),transparent);animation:busflow 6.8s linear infinite}
@keyframes busflow{from{left:-180px}to{left:100%}}
.jobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.job-w{padding-top:40px;position:relative}
.job-w::before{content:"";position:absolute;left:34px;top:26px;height:14px;width:1px;background:var(--line-strong)}
.node{position:absolute;top:1px;left:23px;width:24px;height:24px;border:1px solid var(--line-strong);background:var(--bg);display:grid;place-items:center;transform:rotate(45deg);transition:.4s}
.node i{width:8px;height:8px;background:var(--brass);transition:.4s}
.job-w:hover .node,.job-w.open .node{border-color:var(--verd);box-shadow:0 0 18px var(--verd)}
.job-w:hover .node i,.job-w.open .node i{background:var(--verd)}
.job-w.now .node::after{content:"";position:absolute;inset:-7px;border:1px solid var(--verd);animation:ping 2s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.job{position:relative;height:clamp(250px,calc(100vh - 400px),360px);padding:20px 20px 16px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .5s var(--ease-out),border-color .3s,box-shadow .3s}
.job-w:hover .job,.job-w.open .job{transform:translateY(-6px);border-color:var(--brass);box-shadow:var(--shadow)}
.job-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.job-top .period{font-family:var(--f-mono);font-size:11.5px;color:var(--brass)}
.job h3{font-family:var(--f-display);font-size:clamp(16px,1.35vw,19px);font-weight:600;margin:18px 0 4px;line-height:1.2;position:relative;z-index:1}
.job .company{font-size:13.5px;color:var(--verd);font-weight:600}
.job p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:12px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11.5px;padding:3px 9px;border:1px solid var(--line-strong);border-radius:20px}
.job .tags{margin-top:auto}
.job-hint{margin-top:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.job-hint svg{width:14px;height:14px;transition:transform .4s}
.job-w:hover .job-hint svg,.job-w.open .job-hint svg{transform:rotate(180deg)}
.job-gear{position:absolute;right:-30px;top:-30px;width:96px;height:96px;color:var(--brass);opacity:.35}
.job-drawer{position:absolute;left:0;right:0;bottom:0;height:64%;background:var(--surface-solid);border-top:1px solid var(--brass);padding:20px 20px 16px;transform:translateY(102%);transition:transform .6s var(--ease-out);z-index:2}
.job-drawer::before{content:"";position:absolute;top:-8px;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,var(--brass) 0 6px,transparent 6px 13px)}
.job-w:hover .job-drawer,.job-w.open .job-drawer{transform:none}
.job-drawer h5{margin:0 0 10px;font-size:13px;font-weight:700}
.job-drawer ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px;color:var(--muted)}
.job-drawer li{display:flex;gap:8px}
.job-drawer li::before{content:"";flex:0 0 6px;height:6px;margin-top:7px;background:var(--verd);transform:rotate(45deg)}

/* ============ 3. SKILLS (KNOWLEDGE GRAPH) ============ */
.kn{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.85fr);gap:clamp(18px,2.6vw,40px);align-items:stretch}
.kn-stage,.kn-panel{height:clamp(340px,calc(100vh - 332px),700px)}
.kn-stage{position:relative;min-width:0}
.kn-stage::before{content:"";position:absolute;inset:2% 8%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--surface-solid) 78%,transparent),color-mix(in srgb,var(--surface-solid) 30%,transparent) 62%,transparent)}
#kgraph{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
#kgraph.over{cursor:pointer}
#kgraph.drag{cursor:grabbing}
.kn-br{position:absolute;width:18px;height:18px;border:1.5px solid var(--line-strong);pointer-events:none}
.kn-br.tl{top:0;left:0;border-right:0;border-bottom:0}.kn-br.tr{top:0;right:0;border-left:0;border-bottom:0}
.kn-br.bl{bottom:0;left:0;border-right:0;border-top:0}.kn-br.brr{bottom:0;right:0;border-left:0;border-top:0}
.kn-hud{position:absolute;top:12px;left:18px;display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none}
.kn-hud b{color:var(--ink);font-weight:600}
.kn-hud .kn-rot{color:rgba(var(--bit),.85)}
.kn-ctl{position:absolute;top:8px;right:10px;display:flex;gap:8px}
.kn-ctl .ibtn{width:36px;height:36px;background:var(--surface);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.kn-ctl .ibtn svg{width:16px;height:16px}
#knSpin .i-play{fill:currentColor;stroke:none;display:none}
#knSpin[aria-pressed="false"] .i-play{display:block}
#knSpin[aria-pressed="false"] .i-pause{display:none}
#knReset:hover svg{transform:rotate(-120deg)}
.kn-hint{position:absolute;right:16px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.kn-hint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--verd)}
.kn-card{--c:var(--k-auto);position:absolute;left:12px;bottom:12px;width:min(350px,calc(100% - 24px));max-height:calc(100% - 64px);overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;
  padding:14px 16px 16px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(var(--c),.55);border-radius:8px;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .55s var(--ease-out),border-color .4s,visibility 0s .55s}
.kn-card.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.kn-card-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kn-card-top .deg{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--brass);white-space:nowrap}
.kn-card-top .ibtn{width:28px;height:28px;flex:0 0 auto}
.kn-card-top .ibtn svg{width:14px;height:14px}
.kn-card h3{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,1.6vw,22px);line-height:1.15;margin:6px 0 12px}
.kn-dot{flex:0 0 auto;width:8px;height:8px;transform:rotate(45deg);background:rgb(var(--c));box-shadow:0 0 8px rgba(var(--c),.55)}
.kn-rel-l{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.kn-rel{display:flex;flex-wrap:wrap;gap:6px}
.kn-rel button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;font-size:12px;border:1px solid var(--line-strong);border-radius:20px;transition:border-color .25s,background .25s}
.kn-rel button .kn-dot{width:6px;height:6px;box-shadow:none}
.kn-rel button:hover{border-color:rgb(var(--c));background:rgba(var(--c),.1)}
.kn-rel button:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.kn-panel{display:flex;flex-direction:column;min-width:0}
.kn-panel .panel-bar b{font-family:var(--f-mono);font-weight:600;color:var(--brass)}
.kn-search{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:relative;cursor:text}
.kn-search::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--verd);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease-out)}
.kn-search:focus-within::after{transform:scaleX(1)}
.kn-search svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.kn-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font:inherit;font-size:14px;color:var(--ink);padding:3px 0;-webkit-appearance:none;appearance:none}
.kn-search input::placeholder{color:var(--muted)}
.kn-list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;scrollbar-width:thin;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 22px),transparent)}
.kn-sec{padding:10px 0 12px;border-bottom:1px dashed var(--line)}
.kn-sec:last-of-type{border-bottom:0}
.kn-sec-h{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;padding:3px 0 9px;font-weight:700;font-size:13.5px;line-height:1.25}
.kn-sec-h .kn-idx{font-family:var(--f-mono);font-size:11px;font-weight:600;color:rgb(var(--c));display:flex;align-items:center;gap:7px}
.kn-sec-h .kn-idx::before{content:"";width:9px;height:9px;transform:rotate(45deg);border:1.5px solid rgb(var(--c));transition:background .3s,box-shadow .3s}
.kn-sec-h .kn-n{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.kn-sec-h:hover .kn-sec-t,.kn-sec-h[aria-pressed="true"] .kn-sec-t{color:rgb(var(--c))}
.kn-sec-h[aria-pressed="true"] .kn-idx::before{background:rgb(var(--c));box-shadow:0 0 10px rgb(var(--c))}
.kn-sec-h:focus-visible{outline:1.5px dashed var(--verd);outline-offset:3px}
.kn-items{display:flex;flex-wrap:wrap;gap:6px}
.kn-it{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;font-size:12.5px;line-height:1.35;border:1px solid var(--line);border-radius:4px;background:color-mix(in srgb,var(--surface-solid) 60%,transparent);transition:border-color .25s,background .25s,box-shadow .25s,opacity .25s}
.kn-it::before{content:"";flex:0 0 auto;width:6px;height:6px;transform:rotate(45deg);background:rgb(var(--c))}
.kn-it.hub{font-weight:700;border-color:rgba(var(--c),.5)}
.kn-it:hover,.kn-it.hl{border-color:rgb(var(--c));background:rgba(var(--c),.1)}
.kn-it[aria-pressed="true"]{border-color:rgb(var(--c));background:rgba(var(--c),.2);box-shadow:0 0 0 3px rgba(var(--c),.14)}
.kn-it:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.kn-it[hidden],.kn-sec[hidden]{display:none}
.kn-empty{margin:18px 0;font-size:13px;color:var(--muted);text-align:center}

/* ============ 4. CERTIFICATES ============ */
.certs{display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,1.6fr);gap:clamp(24px,4vw,64px);align-items:center}
.panel{border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;overflow:hidden}
.panel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.leds{display:flex;gap:6px}
.leds i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.leds i:nth-child(1){background:var(--verd);box-shadow:0 0 8px var(--verd);animation:blink 1.6s infinite}
.leds i:nth-child(2){background:var(--brass)}
.ci-body{padding:22px 20px}
.ci-id{font-family:var(--f-mono);font-size:12px;color:var(--brass)}
.ci-body h3{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,1.7vw,24px);margin:8px 0 16px;line-height:1.2;min-height:2.4em}
.ci-body dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 18px;font-size:13.5px}
.ci-body dt{color:var(--muted)}
.ci-body dd{margin:0;font-weight:600}
.ci-check{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line-strong);border-radius:6px;margin-bottom:18px;overflow:hidden;white-space:nowrap}
.ci-check .ok{color:var(--verd);font-weight:600;flex:0 0 auto}
.ci-check #ciHash{overflow:hidden;text-overflow:ellipsis}
.ci-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn[hidden]{display:none}
.ci-list{display:flex;gap:8px;margin-top:14px}
.ci-list button{all:unset;cursor:pointer;flex:1;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);text-align:center;transition:.3s}
.ci-list button.active{border-color:var(--brass);color:var(--ink);background:var(--brass-soft)}
.cert-stage{height:clamp(280px,calc(100vh - 330px),600px);display:flex;align-items:center;justify-content:center}
.cert-gal{display:flex;gap:18px;align-items:center}
.cert-col{display:flex;flex-direction:column;gap:18px;align-items:center}
.cert{position:relative;perspective:1000px;cursor:pointer;outline-offset:8px}
.cert-in{position:absolute;inset:0;border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:3px;transition:transform .25s ease-out,box-shadow .4s,border-color .4s;overflow:hidden}
.cert:hover .cert-in,.cert.active .cert-in{border-color:var(--brass)}
.cert:hover .cert-in{box-shadow:var(--shadow)}
.cert .br{position:absolute;width:16px;height:16px;border:2px solid var(--brass);transition:transform .45s var(--ease-out);z-index:2;pointer-events:none;opacity:.8}
.cert .br.tl{top:-8px;left:-8px;border-right:0;border-bottom:0}
.cert .br.tr{top:-8px;right:-8px;border-left:0;border-bottom:0}
.cert .br.bl{bottom:-8px;left:-8px;border-right:0;border-top:0}
.cert .br.brr{bottom:-8px;right:-8px;border-left:0;border-top:0}
.cert:hover .br.tl{transform:translate(-5px,-5px)}.cert:hover .br.tr{transform:translate(5px,-5px)}
.cert:hover .br.bl{transform:translate(-5px,5px)}.cert:hover .br.brr{transform:translate(5px,5px)}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg2);border:1px solid var(--line-strong);z-index:2;transition:transform .6s var(--ease-out)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:1px;margin-top:-.5px;background:var(--muted)}
.screw.s1{top:8px;left:8px}.screw.s2{top:8px;right:8px}.screw.s3{bottom:8px;left:8px}.screw.s4{bottom:8px;right:8px}
.cert:hover .screw{transform:rotate(180deg)}
.cert-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.22),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.cert:hover .glare{opacity:1}

/* ============ 5. PROJECTS ============ */
.proj-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.car-ctrl{display:flex;align-items:center;gap:12px}
.gbtn{all:unset;cursor:pointer;width:52px;height:52px;display:grid;place-items:center;position:relative;border-radius:50%}
.gbtn .g{position:absolute;inset:0;width:100%;height:100%;color:var(--line-strong);transition:color .3s}
.gbtn:hover .g{color:var(--brass)}
.gbtn .ar{width:18px;height:18px;position:relative;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.car-count{font-family:var(--f-mono);font-size:13px;min-width:64px;text-align:center}
.car-count b{color:var(--brass);font-weight:600}
.carousel{position:relative;height:clamp(320px,calc(100vh - 380px),520px);margin-top:clamp(14px,2.4vh,26px);perspective:1800px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pcard{--w:min(470px,76vw);position:absolute;top:0;left:50%;width:var(--w);height:100%;margin-left:calc(var(--w) / -2);transition:transform .9s var(--ease-out),opacity .7s,filter .7s;will-change:transform;outline-offset:6px}
.carousel.dragging .pcard{transition:transform .12s linear,opacity .3s}
.pc-in{position:relative;height:100%;display:flex;flex-direction:column;border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:12px;overflow:hidden;transition:transform .3s ease-out,box-shadow .5s;cursor:pointer}
.pcard.center .pc-in{box-shadow:var(--shadow),0 0 0 1px var(--brass-soft)}
.pcard.center::before{content:"";position:absolute;inset:-2px;border-radius:14px;padding:2px;background:conic-gradient(from var(--ang),var(--brass),transparent 28%,var(--verd) 50%,transparent 78%,var(--brass));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:angspin 5s linear infinite;z-index:2;pointer-events:none}
@keyframes angspin{to{--ang:360deg}}
.pc-media{position:relative;flex:0 0 54%;overflow:hidden;background:var(--bg2)}
.ph-media{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
  background:linear-gradient(135deg,var(--brass-soft),var(--verd-soft)),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px;
  transition:transform 1.2s var(--ease-out)}
.pcard.center:hover .ph-media{transform:scale(1.06)}
.ph-media svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.badge{position:absolute;top:12px;left:12px;font-size:11.5px;padding:4px 10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;z-index:1}
.play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:1}
.play::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--ink);animation:ping 2.2s var(--ease-out) infinite}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none;opacity:1;margin-left:3px}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;height:3px;background:var(--line-strong);border-radius:2px;overflow:hidden;z-index:1}
.vbar i{position:absolute;inset:0;background:var(--verd);transform-origin:left;animation:vprog 7s linear infinite}
@keyframes vprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pc-body{padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.pc-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pc-meta .id{font-family:var(--f-mono);color:var(--brass)}
.pc-body h3{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.5vw,21px);margin:0;line-height:1.2}
.pc-body p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc-open{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pc-open svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .4s var(--ease-out)}
.pcard.center:hover .pc-open svg{transform:rotate(90deg)}
.pcard:not(.center) .pc-open{opacity:0}
.conveyor{position:relative;height:30px;margin:clamp(12px,2vh,22px) auto 0;max-width:620px}
.belt{position:absolute;left:30px;right:30px;top:7px;height:16px;border-radius:8px;border:1px solid var(--line-strong);
  background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 14px);transition:background-position 1s var(--ease-out)}
.conveyor .cg{position:absolute;top:0;width:30px;height:30px;color:var(--brass)}
.conveyor .cg.l{left:0}.conveyor .cg.r{right:0}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px;background:var(--bg);padding:0 8px}
.dots button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;width:16px;text-align:center;color:var(--muted);transition:color .3s}
.dots button.active{color:var(--verd);font-weight:600}

/* ============ 6. CONTACT ============ */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(26px,5vw,80px);align-items:center}
.term{border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:8px;overflow:hidden;margin-top:26px;max-width:480px}
.term-body{padding:16px 18px;font-family:var(--f-mono);font-size:13px;line-height:2}
.term-body .p{color:var(--brass)}
.term-body a{color:var(--verd);text-decoration:none;border-bottom:1px dashed transparent;transition:border-color .3s}
.term-body a:hover{border-bottom-color:var(--verd)}
.term-body .cur{display:inline-block;width:8px;height:14px;background:var(--verd);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.socials{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.soc{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line-strong);border-radius:40px;font-size:13.5px;font-weight:600;transition:border-color .3s,color .3s}
.soc:hover{border-color:var(--brass);color:var(--brass)}
.tx{position:relative}
.tx form{padding:22px 22px 20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{position:relative;margin-bottom:18px}
.field input,.field textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);padding:20px 0 8px;font:inherit;font-size:15px;color:var(--ink);outline:none;resize:none;border-radius:0}
.field textarea{height:84px}
.field label{position:absolute;left:0;top:20px;color:var(--muted);font-size:14.5px;transition:.3s var(--ease-out);pointer-events:none}
.field input:focus+label,.field input:not(:placeholder-shown)+label,.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{top:0;font-size:12px;color:var(--verd)}
.field .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--verd);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease-out)}
.field input:focus~.bar,.field textarea:focus~.bar{transform:scaleX(1)}
.field.err .bar{background:var(--danger);transform:scaleX(1)}
.field.err label{color:var(--danger)}

.opt span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:.3s}
.opt input:checked+span{border-color:var(--verd);background:var(--verd-soft)}
.opt input:checked+span::before{background:var(--verd);box-shadow:0 0 8px var(--verd)}

.range{margin-bottom:20px}
.range output{font-family:var(--f-mono);color:var(--brass);font-size:12.5px}
.range input{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
.range input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 10px),var(--bg2)}
.range input::-moz-range-track{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 10px),var(--bg2)}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--surface-solid);border:5px solid var(--brass);box-shadow:0 0 0 4px var(--brass-soft)}
.range input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface-solid);border:5px solid var(--brass)}
.send{all:unset;cursor:pointer;box-sizing:border-box;position:relative;overflow:hidden;width:100%;padding:16px 20px;border-radius:40px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;transition:box-shadow .3s}
.send:hover{box-shadow:0 0 0 4px var(--brass-soft),0 14px 30px -12px var(--brass)}
.send .fill{position:absolute;inset:0;background:var(--verd);transform:scaleX(0);transform-origin:left}
.send.sending .fill{transition:transform 2s var(--ease);transform:scaleX(1)}
.send .lbl{position:relative;display:flex;align-items:center;gap:10px}

.tx-done{position:absolute;inset:44px 0 0 0;background:var(--surface-solid);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:10px;clip-path:inset(0 0 100% 0);transition:clip-path .8s var(--ease)}

/* ============ SHUTTER TRANSITION ============ */
.shutter{position:fixed;inset:0;z-index:80;pointer-events:none}
.shutter.closing,.shutter.boot{pointer-events:auto}
.sh{position:absolute;top:0;bottom:0;width:calc(50% + 12px);overflow:hidden;will-change:transform}
.sh-l{left:0;transform:translateX(-103%)}
.sh-r{right:0;transform:translateX(103%)}
.sh-face{position:absolute;top:0;bottom:0;background:var(--sh);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px),linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%,rgba(0,0,0,.25))}
.sh-l .sh-face{left:0;right:24px}.sh-r .sh-face{right:0;left:24px}
.sh-teeth{position:absolute;top:0;bottom:0;width:24px;background:repeating-linear-gradient(180deg,var(--sh) 0 26px,transparent 26px 52px)}
.sh-l .sh-teeth{right:0}
.sh-r .sh-teeth{left:0;background-position:0 26px}
.sh-rivets{position:absolute;top:0;bottom:0;width:10px;background:radial-gradient(circle,rgba(255,255,255,.18) 2.5px,transparent 3px) 0 0/10px 34px}
.sh-l .sh-rivets{right:44px}.sh-r .sh-rivets{left:44px}
.sh-hazard{position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(45deg,var(--brass) 0 8px,transparent 8px 16px);opacity:.55}
.sh-l .sh-hazard{right:62px}.sh-r .sh-hazard{left:62px}
.sh-code{position:absolute;inset:0;font-family:var(--f-mono);font-size:11px;line-height:1.7;color:rgba(var(--bit),.16);white-space:pre;overflow:hidden;padding:20px;word-break:break-all}
.sh-label{position:absolute;top:calc(50% - 205px);width:100vw;text-align:center;color:var(--sh-ink);pointer-events:none}
.sh-l .sh-label{left:0}.sh-r .sh-label{right:0}
.sh-label .k{font-family:var(--f-mono);font-size:12px;color:rgba(var(--bit),.9);letter-spacing:.2em;display:block;margin-bottom:10px}
.sh-label .w{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,110px);line-height:1;white-space:nowrap}
.sh-sub{position:absolute;top:calc(50% + 100px);width:100vw;text-align:center;font-family:var(--f-mono);font-size:12px;color:rgba(228,233,238,.55)}
.sh-l .sh-sub{left:0}.sh-r .sh-sub{right:0}
.shutter.closing .sh-l,.shutter.closing .sh-r{transform:none;transition:transform .6s var(--ease)}
.shutter.opening .sh-l{transform:translateX(-103%);transition:transform .75s var(--ease)}
.shutter.opening .sh-r{transform:translateX(103%);transition:transform .75s var(--ease)}
.shutter.boot .sh-l,.shutter.boot .sh-r{transform:none;transition:none}
.lock{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:0;color:var(--brass)}
.lock svg{width:100%;height:100%;overflow:visible}
.lock .core{fill:var(--sh);stroke:rgba(var(--bit),.8);stroke-width:1.5}
.shutter.closing .lock,.shutter.boot .lock{animation:lockIn .55s .2s var(--ease-out) both}
.shutter.opening .lock{animation:lockOut .5s var(--ease) both}
@keyframes lockIn{from{opacity:0;transform:scale(.3) rotate(-140deg)}to{opacity:1;transform:none}}
@keyframes lockOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.7) rotate(140deg)}}
.sh-flash{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--verd);box-shadow:0 0 30px 4px var(--verd);opacity:0}
.shutter.closing .sh-flash{animation:flash .5s .5s}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.boot-bar{position:absolute;left:50%;top:calc(50% + 130px);width:220px;margin-left:-110px;height:2px;background:rgba(255,255,255,.1);opacity:0}
.boot-bar i{position:absolute;inset:0;background:var(--verd);transform-origin:left;transform:scaleX(0)}
.shutter.boot .boot-bar{opacity:1}
.shutter.boot .boot-bar i{animation:vprog 1.1s var(--ease) forwards}

/* ============ MODALS ============ */
.modal{position:fixed;inset:0;z-index:90;display:none}
.modal.show{display:block}
.m-back{position:absolute;inset:0;background:rgba(10,14,19,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .5s}
.modal.open .m-back{opacity:1}
.m-panel{position:absolute;left:50%;top:50%;max-height:calc(100% - 8vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:min(1180px,92vw);transform:translate(-50%,-50%);background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:clip-path .75s var(--ease)}
.m-head{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head .gear-sm{width:30px;height:30px;color:var(--brass);flex:0 0 auto}
.m-head .ttl{flex:1;min-width:0}
.m-head .ttl small{font-size:12px;color:var(--muted);display:block}
.m-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.8vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-actions{display:flex;gap:8px}
.ibtn{all:unset;cursor:pointer;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;transition:.3s}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .5s var(--ease-out)}
.ibtn:hover{border-color:var(--brass);color:var(--brass)}
.ibtn.x:hover svg{transform:rotate(90deg)}
.m-body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.m-media{padding:20px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.m-screen{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);background:var(--bg2)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs button{all:unset;cursor:pointer;position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;border:1px solid var(--line);transition:border-color .3s}
.thumbs button.active{border-color:var(--brass)}
.thumbs .ph-media svg{width:22px;height:22px}
.m-info{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.m-lead{font-size:15.5px;margin:0;max-width:60ch}
.tabs{position:relative;display:flex;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--muted);transition:color .3s}
.tabs button.active{color:var(--ink)}
.tabs .ind{position:absolute;bottom:-1px;left:0;height:2px;width:33.333%;background:var(--brass);transition:transform .6s var(--ease)}
.tab-view{overflow:hidden}
.tab-track{display:flex;transition:transform .7s var(--ease)}
.tab-track>div{flex:0 0 100%;font-size:14px;color:var(--muted);padding-right:4px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{padding:12px;border:1px solid var(--line);border-radius:8px}
.metric b{font-family:var(--f-display);font-size:22px;display:block;color:var(--verd)}
.metric span{font-size:12px;color:var(--muted)}
.m-links{display:flex;gap:10px;flex-wrap:wrap}
.modal.open .stag{animation:a-up .8s var(--ease-out) both;animation-delay:calc(var(--d,0) * 70ms + 380ms)}
.stag{opacity:0}
.cm .m-panel{width:auto;max-width:92vw;display:flex;flex-direction:column}
.cm .m-body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg2)}
.cm .cert-big{position:relative;border:1px solid var(--line-strong);background:#fff;border-radius:4px;overflow:hidden}

/* ============ CURSOR ============ */
.cursor{display:none}
@media (pointer:fine){
  .cursor{display:block;position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .4s}
  .cursor.live{opacity:1}
  .c-dot,.c-ring-w{position:fixed;left:0;top:0;will-change:transform}
  .c-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--brass)}
  .c-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--line-strong);border-radius:50%;transition:width .35s var(--ease-out),height .35s var(--ease-out),margin .35s var(--ease-out),border-color .3s}
  .cursor.hover .c-ring{width:58px;height:58px;margin:-29px 0 0 -29px;border:1.5px dashed var(--verd);animation:orbit 4s linear infinite}
  .cursor.down .c-ring{width:24px;height:24px;margin:-12px 0 0 -12px}
}

/* ============ RESPONSIVE ============ */
.menu button,.nav-cta{white-space:nowrap}
@media (max-width:1360px){
  .nav-inner{gap:16px}
  .menu button{padding:10px 8px;gap:5px}
}
@media (max-width:1240px){
  .menu button .n{display:none}
}
@media (max-width:1100px){
  .menu button .t{display:none}
  .menu button .n{display:inline}
  .jobs{grid-template-columns:repeat(4,minmax(230px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
  .job-w{scroll-snap-align:start}
  .bus-line{width:calc(4 * 250px)}
  .kn{grid-template-columns:minmax(0,1.3fr) minmax(270px,1fr)}
}
@media (max-width:860px){
  :root{--nav-h:66px}

  .chat{right:10px;left:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);height:min(560px,calc(100vh - 170px))}
  .hud-r{display:none}
  .slide-scroll{justify-content:flex-start}
  .hero,.contact,.certs{grid-template-columns:1fr}
  .portrait{--s:min(62vw,300px)}
  .callout.c1{right:-10%}.callout.c2{left:-10%}
  .chips{grid-template-columns:1fr;gap:18px}
  .chip-drawer{position:static;clip-path:none;opacity:1;transform:none;margin-top:10px;display:none;box-shadow:none}
  .chip.open .chip-drawer,.chip:hover .chip-drawer{display:block}
  .cert-stage{height:min(62vh,440px)}
  .row2{grid-template-columns:1fr;gap:0}
  .m-body{grid-template-columns:1fr}
  .m-media{border-right:0;border-bottom:1px solid var(--line)}
  .ghost-num{display:none}
  .foot{position:static;margin-top:24px}
  .kn{grid-template-columns:1fr}
  .kn-stage{height:min(62vh,440px)}
  .kn-panel{height:auto}
  .kn-list{overflow:visible;-webkit-mask-image:none;mask-image:none}
  .kn-card{max-height:calc(100% - 60px)}
  .kn-card.show~.kn-hint{opacity:0}
}
@media (max-width:520px){
  .menu button{padding:10px 7px}
  .nav-cta{display:none}
  .lang{--lw:28px}
  .logo b{font-size:13px}
  .stats{gap:18px}
  .kn-hud{left:12px;top:10px;flex-direction:column}
  .kn-hud .kn-rot{display:none}
  .kn-card{left:8px;bottom:8px;width:calc(100% - 16px);padding:12px 14px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ============ READABILITY SCRIM ============ */
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 52% 54%,color-mix(in srgb,var(--bg) 72%,transparent) 0%,color-mix(in srgb,var(--bg) 40%,transparent) 50%,transparent 82%)}
.fx-swap{animation:fxswap .5s var(--ease-out)}
@keyframes fxswap{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
/* ============ LANGUAGE SWITCH ============ */
.nav-right{display:flex;align-items:center;gap:12px}
.lang{--lw:34px;position:relative;display:flex;padding:3px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface)}
.lang button{all:unset;cursor:pointer;position:relative;z-index:1;width:var(--lw);height:28px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--muted);transition:color .4s;border-radius:20px}
.lang button:hover{color:var(--ink)}
.lang button.active{color:var(--bg)}
.lang button:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.lang .thumb{position:absolute;top:3px;left:3px;width:var(--lw);height:28px;border-radius:20px;background:var(--ink);transition:transform .7s var(--ease);box-shadow:0 0 0 3px var(--brass-soft)}
.lang .thumb::before,.lang .thumb::after{content:"";position:absolute;top:50%;width:3px;height:10px;margin-top:-5px;background:repeating-linear-gradient(180deg,var(--brass) 0 2px,transparent 2px 4px)}
.lang .thumb::before{left:-5px}.lang .thumb::after{right:-5px}
/* ============ CHATBOT ============ */
.chat-fab{all:unset;cursor:pointer;position:fixed;z-index:70;right:clamp(14px,2vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);transition:transform .4s var(--ease-out)}
.chat-fab:hover{transform:scale(1.06)}
.chat-fab .fg{position:absolute;left:-8px;top:-8px;width:74px;height:74px;color:var(--brass);pointer-events:none}
.chat-fab .ic{position:absolute;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transition:transform .5s var(--ease-out),opacity .3s}
.chat-fab .ic-x{opacity:0;transform:rotate(-90deg) scale(.6)}
.chat-fab.open .ic-chat{opacity:0;transform:rotate(90deg) scale(.6)}
.chat-fab.open .ic-x{opacity:1;transform:none}
.chat-fab .tip{position:absolute;right:calc(100% + 18px);white-space:nowrap;background:var(--surface-solid);color:var(--ink);border:1px solid var(--line-strong);padding:7px 12px;border-radius:20px;font-size:13px;opacity:0;transform:translateX(8px);transition:.4s var(--ease-out);pointer-events:none}
.chat-fab:hover .tip{opacity:1;transform:none}
.chat-fab.open .tip{display:none}
.chat-fab .dot{position:absolute;top:3px;right:3px;width:11px;height:11px;border-radius:50%;background:var(--verd);border:2px solid var(--ink);animation:blink 2s infinite}
.chat-fab.open .dot{display:none}
.chat{position:fixed;z-index:75;right:clamp(14px,2vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(390px,calc(100vw - 28px));height:min(580px,calc(100vh - 190px));background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;clip-path:circle(0px at calc(100% - 29px) calc(100% + 43px));visibility:hidden;transition:clip-path .7s var(--ease),visibility 0s .7s}
.chat.open{clip-path:circle(150% at calc(100% - 29px) calc(100% + 43px));visibility:visible;transition:clip-path .75s var(--ease),visibility 0s}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--brass-soft),transparent 60%)}
.chat-head > svg{width:34px;height:34px;color:var(--brass);flex:0 0 auto}
.chat-head b{display:block;font-size:14.5px}
.chat-head small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chat-head small i{width:7px;height:7px;border-radius:50%;background:var(--verd);box-shadow:0 0 8px var(--verd)}
.chat-head small.demo i{background:var(--brass);box-shadow:none}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;animation:msgIn .45s var(--ease-out) both}
.msg.bot{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.typing span{font-family:var(--f-mono);color:var(--verd);letter-spacing:.1em}
.msg .go{all:unset;cursor:pointer;display:flex;width:max-content;margin-top:8px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--verd);color:var(--verd);transition:background .3s,color .3s;white-space:normal}
.msg .go:hover{background:var(--verd);color:var(--bg)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chat-sugg:empty{display:none}
.chat-sugg button{all:unset;cursor:pointer;font-size:12.5px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:20px;transition:.3s}
.chat-sugg button:hover{border-color:var(--verd);color:var(--verd)}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;background:var(--bg2);border:1px solid transparent;border-radius:24px;padding:11px 16px;font:inherit;font-size:14px;color:var(--ink);outline:none;transition:border-color .3s}
.chat-form input:focus{border-color:var(--verd)}
.chat-form button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:0 0 auto;transition:opacity .3s}
.chat-form button:disabled{opacity:.4;cursor:default}
.chat-form button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
</style>
</head>
<body>

<!-- ========== BACKGROUND MACHINERY ========== -->
<div class="bg" aria-hidden="true">
  <canvas id="binary"></canvas>
  <svg id="circuits"></svg>
  <svg id="gears"></svg>
  <div class="scrim"></div>
</div>

<!-- ========== NAV ========== -->

/* ================= GEAR GEOMETRY ================= */
function gearPath(teeth, pitchR, holeR = 0, depth = null) {
  const m = depth ?? (2 * pitchR / teeth);
  const ro = pitchR + m * 0.9, rr = pitchR - m * 1.1, s = Math.PI * 2 / teeth;
  let d = '';
  for (let i = 0; i < teeth; i++) {
    const a = i * s;
    const pts = [[rr, a - s * .5], [rr, a - s * .26], [ro, a - s * .13], [ro, a + s * .13], [rr, a + s * .26]];
    pts.forEach(([r, t], k) => { d += (i === 0 && k === 0 ? 'M' : 'L') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2) + ' '; });
  }
  d += 'Z ';
  if (holeR > 0) d += `M${holeR} 0 A${holeR} ${holeR} 0 1 0 ${-holeR} 0 A${holeR} ${holeR} 0 1 0 ${holeR} 0 Z`;
  return d;
}

function registerSpinners(root = document) {
  $$('[data-spin]', root).forEach(el => {
    if (el._sp) return;
    const s = { el, speed: parseFloat(el.dataset.spin) || 0, angle: rand(0, 360), local: 1, localT: 1, extra: 0, extraT: 0 };
    el._sp = s;
    if (el instanceof SVGElement && el.tagName !== 'svg') { el.style.transformBox = 'view-box'; el.style.transformOrigin = '0 0'; }
    const host = el.closest('[data-spinhost]');
    if (host && !host._spBound) {

      host.addEventListener('mouseleave', () => $$('[data-spin]', host).forEach(e => e._sp && (e._sp.localT = 1)));
    }
    spinners.push(s);
  });
}

    gearSvg.appendChild(g);
    const gears = [];
    def.chain.forEach(([teeth, dirDeg], i) => {
      const r = def.m * teeth / 2;
      let x = def.x, y = def.y, ratio = 1, phase = 0, parent = gears[i - 1];
      if (parent) {

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

// model: nodes with neighbours, deduplicated edges
const KN = (() => {
  const byId = new Map();
  const nodes = KN_NODES.map((d, i) => {
    const n = { id: d.id, cat: d.cat, ci: KN_CATS.indexOf(d.cat), hub: !!d.hub, label: d.name, i, nb: [], edges: [], w: {} };
    if (n.ci < 0) console.warn('KN_NODES: unknown section', d.cat, 'for', d.id);
    Object.defineProperty(n, 'title', { get: () => n.label ?? t('kn.n.' + n.id) });
    byId.set(d.id, n);
    return n;
  });
  const edges = [], seen = new Set();
  KN_LINKS.forEach(line => {
    const [a, rest = ''] = line.split(':'), A = byId.get(a.trim());
    rest.trim().split(/\s+/).filter(Boolean).forEach(b => {
      const B = byId.get(b);
      if (!A || !B || A === B) { console.warn('KN_LINKS: bad link', a.trim(), '→', b); return; }
      const key = Math.min(A.i, B.i) + '-' + Math.max(A.i, B.i);
      if (seen.has(key)) return;
      seen.add(key);
      const e = { a: A, b: B };
      edges.push(e); A.nb.push(B); B.nb.push(A); A.edges.push(e); B.edges.push(e);
    });
  });
  nodes.forEach(n => { n.deg = n.nb.length; n.hood = new Set([n, ...n.nb]); });
  const byCat = Object.fromEntries(KN_CATS.map(k => [k, new Set(nodes.filter(n => n.cat === k))]));
  return { nodes, edges, byId, byCat, order: nodes.slice() };
})();

// 3D layout: seeded force simulation — springs on links, repulsion between all nodes,
// every section pulled to its own anchor on a ring, so auto-rotation shows the areas in turn

  const V = nodes.map(() => [0, 0, 0]);

    const F = nodes.map(() => [0, 0, 0]), heat = 1 - it / IT * .8;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], dz = P[i][2] - P[j][2], f = .0012 / (dx*dx + dy*dy + dz*dz + .003);

    }
  });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  // dynamic bits
  $$('#hudR button').forEach((b, i) => b.setAttribute('aria-label', t('nav.' + i)));
  $('#hudName').textContent = t('nav.' + current);
  dots.forEach((d, i) => d.setAttribute('aria-label', t('proj.n') + ' ' + (i + 1)));
  pcards.forEach((c, i) => c.setAttribute('aria-label', PROJECTS[i].title));
  CERTS.forEach(c => c._el && c._el.setAttribute('aria-label', t('cert.open') + ': ' + c.title));
  selectCert(activeCert, !animate);
  kgLang();
  $('#budgetOut').textContent = t('budgets')[+$('#budget').value];
  $('#txStatus').textContent = t(txState === 'done' ? 'f.delivered' : txState === 'fix' ? 'f.fix' : 'f.ready');
  if (!$('#send').classList.contains('sending')) $('#sendTxt').textContent = t('f.send');
  else if (txState === 'done') $('#sendTxt').textContent = t('f.sent');
  if (pm.classList.contains('show')) { $('#pmMeta').textContent = `${PROJECTS[pmIdx].id} · ${PROJECTS[pmIdx].catName}`; $('#pmTitle').textContent = PROJECTS[pmIdx].title; }
  if (cm.classList.contains('show')) { const c = CERTS[activeCert]; $('#cmMeta').textContent = `${c.id} · ${c.org} · ${c.dateStr}`; $('#cmTitle').textContent = c.title; $('.cert-img', cm)?.setAttribute('alt', c.title); }
  chatLang();
  setTimeout(() => placeRoller(current), animate ? 560 : 0);
}
$$('#lang button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === LANG) return;
  boost(LANGS.indexOf(b.dataset.lang) > LANGS.indexOf(LANG) ? 4 : -4);
  applyLang(b.dataset.lang, true);
}));

/* ================= CHATBOT ================= */
const chat = $('#chat'), fab = $('#chatFab'), msgsEl = $('#chatMsgs'), chatIn = $('#chatIn');
let sampleFn = null, chatMode = 'demo', chatBusy = false, chatCtl = null;
const chatLog = []; // {who:'me'|'bot', text, go?}
const chatOpen = () => chat.classList.contains('open');
function setChatStatus() {
  const s = $('#chatStatus');
  s.classList.toggle('demo', chatMode !== 'ai');
  $('span', s).textContent = t(chatMode === 'ai' ? 'chat.online' : 'chat.demo');
}
function goBtn(i) { return `<button class="go" data-go="${i}" type="button">${t('chat.go')}: ${t('nav.' + i)}</button>`; }
function renderMsg(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.who;
  const txt = document.createElement('span'); txt.textContent = m.text; el.appendChild(txt);
  if (m.go != null) el.insertAdjacentHTML('beforeend', goBtn(m.go));
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return el;
}
function renderSugg() {
  $('#chatSugg').innerHTML = chatLog.length > 2 ? '' : t('chat.s').map(s => `<button type="button">${s}</button>`).join('');
  $$('#chatSugg button').forEach(b => b.addEventListener('click', () => sendChat(b.textContent)));
}
function chatLang() {
  setChatStatus();
  if (chatLog.length <= 1) { chatLog.length = 0; chatLog.push({ who: 'bot', text: t('chat.hello') }); msgsEl.innerHTML = ''; renderMsg(chatLog[0]); }
  renderSugg();
}
function toggleChat(open = !chatOpen()) {
  chat.classList.toggle('open', open);
  fab.classList.toggle('open', open);
  fab.setAttribute('aria-expanded', open);
  kick($('.fg g', fab), open ? 180 : -180);
  if (open) setTimeout(() => chatIn.focus({ preventScroll: true }), 350);
}
fab.addEventListener('click', () => toggleChat());
$('#chatClose').addEventListener('click', () => toggleChat(false));
msgsEl.addEventListener('click', e => { if (e.target.closest('[data-go]') && innerWidth < 700) toggleChat(false); });

function fallbackAnswer(q) {
  const s = q.toLowerCase();
  const rules = [
    [/цен|стоим|сколько|бюджет|price|cost|budget|rate|preis|kost/, 'fb.price', 5],
    [/связ|контакт|почт|mail|telegram|contact|reach|kontakt|erreich|schreib/, 'fb.contact', 5],
    [/сертиф|certif|zertif/, 'fb.certs', 3],
    [/знани|навык|технолог|стек|java|spring|n8n|skill|stack|technolog|kenntnis|fähigkeit|wissen/, 'fb.skills', 2],
    [/опыт|путь|работал|experience|career|erfahrung|werdegang/, 'fb.exp', 1],
    [/проект|портфол|пример|project|portfolio|example|projekt|beispiel/, 'fb.projects', 4],
    [/услуг|умее|делае|service|offer|what do you|leistung|angebot|dienst/, 'fb.services', 0],
  ];
  for (const [re, key, go] of rules) if (re.test(s)) return { text: t(key), go };
  return { text: t('fb.default'), go: 5 };
}
function buildPrompt() {
  const convo = chatLog.slice(-10).map(m => (m.who === 'me' ? 'Visitor: ' : 'Assistant: ') + m.text).join('\n');
  return `You are a friendly assistant on the portfolio website of a freelance developer named "${t('name.full')}". ` +
    `Services: software development, web development, AI automation. ` +
    `Certificates (real facts): ${CERTS.map(c => `${c.title} — ${c.org}, ${c.dateStr}`).join('; ')}. ` +
    `Skills by area (real facts, from the knowledge graph): ${KN_CATS.map(k => `${t('kn.cat.' + k)}: ${[...KN.byCat[k]].map(n => n.title).join(', ')}`).join('; ')}. ` +
    `Website sections: 0 = About, 1 = Experience, 2 = Skills (3D knowledge graph), 3 = Certificates, 4 = Projects, 5 = Contact form. ` +
    `Apart from the certificates and the skills, the website content is still placeholder text, so NEVER invent specific facts (prices, employers, clients, dates, project details). ` +
    `For anything specific, suggest the contact form or the email hello@example.com. ` +
    `Reply ONLY in ${t('langName')}, at most 3 short sentences, plain text without markdown. ` +
    `If one website section is relevant, end your reply with exactly one tag like [[go:3]].\n\n` +
    `${convo}\nAssistant:`;
}
const cleanTag = s => s.replace(/\[\[go:\d\]\]/g, '').replace(/\[\[[^\]]*$/, '').trim();
async function sendChat(text) {
  text = text.trim();
  if (!text || chatBusy) return;
  chatBusy = true; $('#chatSend').disabled = true;
  chatLog.push({ who: 'me', text }); renderMsg(chatLog.at(-1)); renderSugg();
  chatIn.value = '';
  const bubble = renderMsg({ who: 'bot', text: '' });
  const span = $('span', bubble);
  bubble.classList.add('typing');
  const iv = setInterval(() => { span.textContent = Array.from({ length: 3 }, () => ri(0, 1)).join(' '); }, 120);
  const finish = (answer, go) => {
    clearInterval(iv); bubble.classList.remove('typing');
    span.textContent = answer;
    if (go != null && go >= 0 && go < N) bubble.insertAdjacentHTML('beforeend', goBtn(go));
    chatLog.push({ who: 'bot', text: answer, go });
    msgsEl.scrollTop = msgsEl.scrollHeight;
    chatBusy = false; $('#chatSend').disabled = false;
    kick($('.chat-head > svg g'), 120);
  };
  if (chatMode !== 'ai' || !sampleFn) {
    setTimeout(() => { const a = fallbackAnswer(text); finish(a.text, a.go); }, 650);
    return;
  }
  chatCtl = new AbortController();
  try {
    const { text: out } = await sampleFn(buildPrompt(), {
      modelTier: 'quick', cache: false, signal: chatCtl.signal,
      onText: ({ text: so }) => { clearInterval(iv); bubble.classList.remove('typing'); span.textContent = cleanTag(so); msgsEl.scrollTop = msgsEl.scrollHeight; }
    });
    const m = out.match(/\[\[go:(\d)\]\]/);
    finish(cleanTag(out) || t('fb.default'), m ? +m[1] : null);
  } catch (e) {
    if (e && e.code === 'not_granted') { chatMode = 'demo'; setChatStatus(); const a = fallbackAnswer(text); finish(a.text, a.go); }
    else if (e && e.code === 'rate_limited') finish(t('chat.rate'), null);
    else if (e && e.code === 'cancelled') finish(cleanTag(e.text || '') || '…', null);
    else finish(cleanTag(e?.text || '') || t('chat.err'), null);
  }
}
$('#chatForm').addEventListener('submit', e => { e.preventDefault(); sendChat(chatIn.value); });
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const s = await window.claude.use('sample');
    if (s) { sampleFn = s; chatMode = 'ai'; setChatStatus(); }
  } catch (e) { /* stay in demo mode */ }
})();

/* ================= INIT ================= */
function buildAll() { buildGears(); buildCircuits(); buildBinary(); layoutCerts(); placeRoller(current, true); layoutCar(); kgResize(); }
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(buildAll, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => setTimeout(readTheme, 50));
new MutationObserver(() => setTimeout(readTheme, 50)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

readTheme();
buildCerts();
applyLang(LANG, false);
registerSpinners();
buildGears(); buildCircuits(); buildBinary();

const fromHash = slides.findIndex(s => '#' + s.id === location.hash);
current = fromHash >= 0 ? fromHash : 0;
slides[current].classList.add('active');
setActiveUI(current);
requestAnimationFrame(() => { placeRoller(current, true); layoutCerts(); });
document.fonts?.ready.then(() => { placeRoller(current, true); layoutCerts(); KN.nodes.forEach(n => n.w = {}); });
requestAnimationFrame(loop);

// boot sequence: shutters start closed, then open
prepShutter(current);
$$('.sh-label .w', shutter).forEach(e => e.textContent = t('sh.boot'));
$$('.sh-label .k', shutter).forEach(e => e.textContent = t('sh.init'));
$$('.sh-sub', shutter).forEach(e => e.textContent = t('sh.bootSub'));
busy = true;
boost(1);
setTimeout(() => {
  shutter.classList.remove('boot'); void shutter.offsetWidth;
  shutter.classList.add('opening'); boost(8);
  setTimeout(() => enterSlide(current), 200);
  setTimeout(() => { shutter.classList.remove('opening'); busy = false; }, 850);
}, RM ? 50 : 1250);
})();
</script>
</body>
