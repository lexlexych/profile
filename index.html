/* ============ TOKENS ============ */
:root{
  --bg:#E6EAEE; --bg2:#D9DFE5; --surface:rgba(244,246,248,.94); --surface-solid:#F3F5F7;
  --ink:#16202B; --muted:#48525F; --line:rgba(22,32,43,.12); --line-strong:rgba(22,32,43,.3);
  --brass:#936A1E; --verd:#1C7B69; --brass-soft:rgba(147,106,30,.12); --verd-soft:rgba(28,123,105,.12);
  --grid:rgba(22,32,43,.05); --gear-fill:rgba(22,32,43,.035); --gear-stroke:rgba(22,32,43,.14);
  --sh:#1A222C; --sh-ink:#E4E9EE; --danger:#B8412B; --logo-bg:#FFFFFF;
  --shadow:0 24px 60px -24px rgba(22,32,43,.35);
  --bit:28,123,105;
  --k-java:147,106,30; --k-back:44,98,146; --k-web:182,58,102; --k-ai:118,76,156; --k-auto:28,123,105;
  --nav-h:66px;
  --ease:cubic-bezier(.76,0,.24,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:'Tektur','Russo One','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --bg2:#161D26; --surface:rgba(22,29,38,.93); --surface-solid:#18202A;
    --ink:#E4E9EE; --muted:#A0ABB8; --line:rgba(160,190,200,.12); --line-strong:rgba(160,190,200,.28);
    --brass:#D4A24C; --verd:#5CC7B0; --brass-soft:rgba(212,162,76,.13); --verd-soft:rgba(92,199,176,.12);
    --grid:rgba(160,190,200,.04); --gear-fill:rgba(212,162,76,.03); --gear-stroke:rgba(212,162,76,.2);
    --sh:#0C1117; --danger:#F07A5C; --logo-bg:#E8ECF0;
    --shadow:0 30px 80px -30px rgba(0,0,0,.85);
    --bit:92,199,176;
    --k-java:212,162,76; --k-back:108,166,222; --k-web:238,120,160; --k-ai:178,146,226; --k-auto:92,199,176;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --bg2:#161D26; --surface:rgba(22,29,38,.93); --surface-solid:#18202A;
  --ink:#E4E9EE; --muted:#A0ABB8; --line:rgba(160,190,200,.12); --line-strong:rgba(160,190,200,.28);
  --brass:#D4A24C; --verd:#5CC7B0; --brass-soft:rgba(212,162,76,.13); --verd-soft:rgba(92,199,176,.12);
  --grid:rgba(160,190,200,.04); --gear-fill:rgba(212,162,76,.03); --gear-stroke:rgba(212,162,76,.2);
  --sh:#0C1117; --danger:#F07A5C; --logo-bg:#E8ECF0;
  --shadow:0 30px 80px -30px rgba(0,0,0,.85);
  --bit:92,199,176;
  --k-java:212,162,76; --k-back:108,166,222; --k-web:238,120,160; --k-ai:178,146,226; --k-auto:92,199,176;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px dashed var(--verd);outline-offset:3px}
.mono{font-family:var(--f-mono)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ============ BACKGROUND MACHINERY ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1100px 700px at 12% 8%,var(--brass-soft),transparent 60%),
             radial-gradient(900px 640px at 92% 92%,var(--verd-soft),transparent 60%),var(--bg)}
.bg::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
#binary,#circuits,#gears{position:absolute;inset:0;width:100%;height:100%}
#binary{opacity:.28;-webkit-mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%);mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%)}
#circuits{opacity:.75;-webkit-mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%);mask-image:radial-gradient(ellipse 60% 58% at 52% 52%,rgba(0,0,0,.1) 15%,#000 88%)}
#circuits .trace{fill:none;stroke:var(--line);stroke-width:1.2}
#circuits .via{fill:var(--bg);stroke:var(--line-strong);stroke-width:1.2}
#circuits .pulse{fill:none;stroke:var(--verd);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:16 9999;animation:pulse var(--dur,6s) linear infinite;animation-delay:var(--del,0s);filter:drop-shadow(0 0 4px var(--verd))}
@keyframes pulse{from{stroke-dashoffset:16px}to{stroke-dashoffset:calc(var(--len) * -1px)}}
#gears .gear{fill:var(--gear-fill);stroke:var(--gear-stroke);stroke-width:1.2}
#gears .gear-v{stroke:rgba(var(--bit),.28)}
#gears .deco{fill:none;stroke:var(--gear-stroke);stroke-width:1}
#gears .deco-d{fill:none;stroke:var(--gear-stroke);stroke-width:1;stroke-dasharray:3 6}

/* ============ NAV ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px)}
.nav::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 35%,transparent);pointer-events:none}
.nav-inner{position:relative;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(16px,3vw,44px)}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px}
.logo svg{width:36px;height:36px;color:var(--brass)}
.logo b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;display:block;line-height:1.1}
.logo small{font-size:11.5px;color:var(--muted);display:block}
/* main menu: pill of toggle buttons, the thumb slides under the active one */
.menu{position:relative;display:flex;padding:3px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface)}
.menu button{all:unset;cursor:pointer;position:relative;z-index:1;height:30px;display:flex;align-items:center;padding:0 15px;border-radius:20px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:color .4s}
.menu button:hover{color:var(--ink)}
.menu button.active{color:var(--bg)}
.menu button:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.menu-thumb{position:absolute;top:3px;left:0;height:30px;border-radius:20px;background:var(--ink);box-shadow:0 0 0 3px var(--brass-soft);transition:transform .7s var(--ease),width .7s var(--ease)}
.menu-thumb::before,.menu-thumb::after{content:"";position:absolute;top:50%;width:3px;height:10px;margin-top:-5px;background:repeating-linear-gradient(180deg,var(--brass) 0 2px,transparent 2px 4px)}
.menu-thumb::before{left:-5px}.menu-thumb::after{right:-5px}
/* narrow screens: the menu turns into a dropdown panel on the left */
.prefs.nav-dd{display:none;margin-right:auto}
.nav-dd .dd-btn{font-family:var(--f-body);font-size:13.5px;padding:0 10px 0 14px}
.nav-dd .dd-menu{left:-4px;right:auto}

/* ============ HUD ============ */
.hud{position:fixed;z-index:40;color:var(--muted);font-size:12px}
.hud-r{right:clamp(10px,1.6vw,26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;align-items:flex-end}
.hud-r button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px}
.hud-r .bits{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);opacity:0;transform:translateX(8px);transition:.4s var(--ease-out)}
.hud-r button:hover .bits,.hud-r button.active .bits{opacity:1;transform:none}
.hud-r button.active .bits{color:var(--verd)}
.hud-r .pip{width:9px;height:9px;border:1px solid var(--line-strong);transform:rotate(45deg);transition:.4s}
.hud-r button.active .pip{background:var(--verd);border-color:var(--verd);box-shadow:0 0 12px var(--verd)}
/* bottom bar: pager on the left, legal links on the right; the links wrap to a row of their own only when they do not fit */
.bar{position:fixed;z-index:40;left:clamp(14px,2vw,28px);right:clamp(14px,2vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar.wrapped{justify-content:center}
.bar.wrapped .legal{margin-left:0}
.pager{display:flex;gap:10px;min-width:0;max-width:100%}
.pg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px 0 5px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface-solid);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;transition:border-color .3s,box-shadow .3s,opacity .4s,visibility .4s}
.pg-next{flex-direction:row-reverse;padding:0 5px 0 16px}
.pg:hover{border-color:var(--verd);box-shadow:var(--shadow),0 0 0 4px var(--verd-soft)}
.pg:focus-visible{outline:1.5px dashed var(--verd);outline-offset:3px}
.pg:disabled{display:none}
.pg-arr{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--verd);color:var(--bg);transition:transform .4s var(--ease-out)}
.pg-arr svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pg-prev:hover .pg-arr{transform:translateX(-3px)}
.pg-next:hover .pg-arr{transform:translateX(3px)}
.pg-n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pg-n b{color:var(--verd);font-family:var(--f-mono);font-size:12px;font-weight:600;margin-right:7px}

/* ============ STAGE / SLIDES ============ */
.stage{position:fixed;inset:0;z-index:10}
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto}
/* the scroll area ends above the bottom bar (pager + legal links), so content is cut off before it reaches them */
.slide-scroll{position:absolute;inset:0 0 var(--bar-h,calc(env(safe-area-inset-bottom,0px) + 70px));overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 14px) clamp(20px,6vw,110px) 14px;
  display:flex;flex-direction:column;justify-content:center}
.slide-scroll::-webkit-scrollbar{display:none}
/* content slides: title at the same height on every slide instead of centering */
#experience .slide-scroll,#skills .slide-scroll,#certs .slide-scroll,#projects .slide-scroll{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + var(--top-gap,clamp(12px,2.8vh,34px)))}
.wrap{width:100%;max-width:1320px;margin:0 auto}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
/* legal links: pinned bottom right on every slide, level with the pager */
.legal{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:12px}
.legal button,.chk button{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong);transition:color .3s}
.legal button:hover,.legal button:focus-visible,.chk button:hover,.chk button:focus-visible{color:var(--brass)}
.ghost-num{position:absolute;right:clamp(10px,4vw,70px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--f-display);font-weight:800;font-size:clamp(120px,22vw,300px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none;z-index:-1}

/* entrance choreography (on wrappers only) */
[data-a]{opacity:0}
.slide.in [data-a]{animation:var(--anim,a-up) .95s var(--ease-out) both;animation-delay:calc(var(--d,0) * 90ms + 40ms)}
[data-a="left"]{--anim:a-left}[data-a="right"]{--anim:a-right}[data-a="scale"]{--anim:a-scale}[data-a="clip"]{--anim:a-clip}[data-a="fade"]{--anim:a-fade}
@keyframes a-up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes a-left{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes a-right{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes a-scale{from{opacity:0;transform:scale(.8) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes a-clip{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes a-fade{from{opacity:0}to{opacity:1}}

.s-head{margin-bottom:clamp(18px,3vh,34px)}
.s-title{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.8vw,54px);line-height:1.02;margin:0;letter-spacing:-.01em}
.s-sub{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:15px}

/* ============ BUTTONS ============ */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:40px;font-weight:600;font-size:14.5px;transition:background .3s,color .3s,border-color .3s,box-shadow .3s;position:relative}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 0 0 4px var(--brass-soft),0 12px 30px -10px var(--brass)}
.btn-primary svg{color:var(--brass)}
.btn-ghost{border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--verd);color:var(--verd)}
.magnetic{transition:transform .35s var(--ease-out),background .3s,color .3s,border-color .3s,box-shadow .3s}

/* ============ 1. ABOUT ============ */
.hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(26px,5vw,90px);align-items:center}
.portrait-w{display:flex;flex-direction:column;align-items:center}
.portrait{--s:min(calc(100vh - 330px),34vw,470px);width:var(--s);height:var(--s);position:relative;perspective:900px}
.portrait-tilt{position:absolute;inset:0;transition:transform .3s ease-out;transform-style:preserve-3d}
.portrait svg.ring,.portrait svg.ticks{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.portrait svg.ring .rg{fill:var(--surface-solid);stroke:var(--brass);stroke-width:1.3}
.portrait svg.ticks{inset:7%;width:86%;height:86%;color:var(--line-strong)}
.photo{position:absolute;inset:17%;border-radius:50%;overflow:hidden;border:1px solid var(--line-strong);
  background:radial-gradient(circle at 50% 30%,var(--bg2),var(--surface-solid) 70%);box-shadow:inset 0 0 40px rgba(0,0,0,.15)}
.photo:has(img){background:#fff}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;opacity:0;transition:opacity .45s var(--ease-out)}
.photo.playing video{opacity:1}
.photo.playing .scan{display:none}
/* play button: a wide pill with lens-convex top and bottom, overlapping the photo edge and the ticks ring.
   It sits outside .portrait-tilt: the whole box is the hit area and 3D hit-testing never steals the click */
.hero-play{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;left:50%;top:84.5%;width:clamp(76px,22%,104px);aspect-ratio:120/72;transform:translate(-50%,-50%);z-index:5;
  display:grid;place-items:center;color:var(--bg);-webkit-tap-highlight-color:transparent;transition:transform .3s var(--ease-out)}
.hero-play:hover{transform:translate(-50%,-50%) scale(1.06)}
.hero-play:active{transform:translate(-50%,-50%) scale(.97)}
.hero-play:focus-visible{outline:2px solid var(--verd);outline-offset:6px;border-radius:30%}
.hero-play *{pointer-events:none}
.hero-play .hp-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.22));transition:filter .3s}
.hero-play .hp-halo{fill:none;stroke:var(--bg);stroke-width:10}
.hero-play .hp-glow{fill:none;stroke:var(--brass-soft);stroke-width:0;transition:stroke-width .3s}
.hero-play .hp-body{fill:var(--ink);stroke:var(--brass);stroke-width:2}
.hero-play .hp-halo,.hero-play .hp-glow,.hero-play .hp-body,.hero-play .hp-pulse{vector-effect:non-scaling-stroke}
/* idle call to action: the pill breathes and a brass wave rolls off it; stops on hover and while the video plays */
.hero-play .hp-pulse{fill:none;stroke:var(--brass);stroke-width:0;opacity:0;animation:hpWave 2.4s var(--ease-out) infinite}
.hero-play .hp-bg,.hero-play .i-play{animation:hpBreathe 2.4s ease-in-out infinite}
.hero-play:hover .hp-pulse,.hero-play.on .hp-pulse,.hero-play:hover .hp-bg,.hero-play.on .hp-bg,.hero-play:hover .i-play{animation:none}
@keyframes hpWave{0%{stroke-width:4;opacity:.75}100%{stroke-width:34;opacity:0}}
@keyframes hpBreathe{0%,100%{transform:none}50%{transform:scale(1.045)}}
.hero-play:hover .hp-glow{stroke-width:18}
.hero-play:hover .hp-body{fill:color-mix(in srgb,var(--ink) 88%,var(--brass))}
.hero-play .i-play,.hero-play .i-pause{position:relative;width:34%;height:auto;aspect-ratio:1;fill:currentColor}
.hero-play .i-pause,.hero-play.on .i-play{display:none}
.hero-play.on .i-pause{display:block}
.hero-play .i-play{margin-left:5%}
.photo .scan{position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(to bottom,transparent,rgba(var(--bit),.18) 85%,rgba(var(--bit),.6));animation:scan 4s var(--ease) infinite}
@keyframes scan{0%{top:-40%}60%,100%{top:110%}}
.orbit{position:absolute;inset:3%;border-radius:50%;animation:orbit 14s linear infinite;pointer-events:none}
.portrait.still .orbit{animation-play-state:paused}
.orbit.o2{inset:-4%;animation-duration:22s;animation-direction:reverse}
.orbit.o3{inset:10%;animation-duration:9s}
.orbit span{position:absolute;top:-9px;left:50%;margin-left:-8px;width:16px;height:18px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--verd);background:var(--bg);border:1px solid var(--verd-soft);border-radius:3px}
.orbit.o2 span{color:var(--brass);border-color:var(--brass-soft)}
@keyframes orbit{to{transform:rotate(360deg)}}
.callout{position:absolute;display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 12px;border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:30px;white-space:nowrap}
.callout .led{width:7px;height:7px;border-radius:50%;background:var(--verd);box-shadow:0 0 8px var(--verd);animation:blink 2s infinite}
.callout.c1{top:6%;right:-6%}
.callout.c2{bottom:9%;left:-8%}
@keyframes blink{50%{opacity:.35}}

.hero-name{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6.4vw,96px);line-height:.92;margin:0;letter-spacing:-.02em}
.hero-name .l2{display:block;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.typer{margin:18px 0 0;font-family:var(--f-mono);font-size:clamp(14px,1.3vw,17px);color:var(--verd);min-height:1.6em}
.typer .caret{display:inline-block;width:9px;height:1.1em;vertical-align:-3px;background:var(--verd);margin-left:3px;animation:blink 1s steps(1) infinite}
.lead{color:var(--muted);font-size:clamp(14.5px,1.15vw,16.5px);max-width:52ch;margin:14px 0 0}
.chips{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:14px;margin:30px 0 26px}
/* service cards open in place: the card grows up and down (the column is centered), the title glides up next to the icon,
   "details" folds away and the description unfolds below; neighbours and the blocks around move aside */
.chip{--mt:.65s var(--ease-out);position:relative;display:flex;flex-direction:column;padding:16px 14px 14px;border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:6px;cursor:pointer;transition:border-color .3s,box-shadow .5s,background .3s;outline-offset:4px}
.chip::before,.chip::after{content:"";position:absolute;left:16px;right:16px;height:6px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 4px,transparent 4px 10px);transition:background .3s,left var(--mt),right var(--mt)}
.chip::before{top:-7px}.chip::after{bottom:-7px}
.chip-ic{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;color:var(--brass);position:relative;transition:color .3s,border-color .3s,background .3s,transform var(--mt)}
.chip-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--mt)}
.chip h4{display:flex;align-items:center;min-height:0;font-size:14.5px;margin:12px 0 0;font-weight:700;line-height:1.25;transition:margin var(--mt),min-height var(--mt)}
.chip .more,.chip-drawer{display:grid;transition:grid-template-rows var(--mt),opacity .35s}
.chip .more{grid-template-rows:1fr}
.chip .more span{min-height:0;overflow:hidden;font-size:12px;color:var(--muted);padding-top:4px}
.chip-drawer{grid-template-rows:0fr;opacity:0}
.chip-drawer p{min-height:0;overflow:hidden;margin:0;font-size:13px;line-height:1.5;color:var(--muted);transform:translateY(12px);transition:transform var(--mt)}
.chip-drawer p::before{content:"";display:block;height:1px;margin:12px 0 10px;background:linear-gradient(90deg,var(--verd),transparent);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease-out) .12s}
.chip:hover,.chip.open,.chip:focus-visible{border-color:var(--verd);background:var(--surface-solid);box-shadow:0 18px 40px -20px var(--verd);z-index:6}
.chip:hover::before,.chip:hover::after,.chip.open::before,.chip.open::after,.chip:focus-visible::before,.chip:focus-visible::after{left:8px;right:8px;background:repeating-linear-gradient(90deg,var(--verd) 0 4px,transparent 4px 10px)}
.chip:hover .chip-ic,.chip.open .chip-ic,.chip:focus-visible .chip-ic{color:var(--verd);border-color:var(--verd);background:var(--verd-soft);transform:rotate(-90deg) scale(.94)}
.chip:hover .chip-ic svg,.chip.open .chip-ic svg,.chip:focus-visible .chip-ic svg{transform:rotate(90deg)}
.chip:hover h4,.chip.open h4,.chip:focus-visible h4{margin:-36px 0 0 48px;min-height:36px}
.chip:hover .more,.chip.open .more,.chip:focus-visible .more{grid-template-rows:0fr;opacity:0}
.chip:hover .chip-drawer,.chip.open .chip-drawer,.chip:focus-visible .chip-drawer{grid-template-rows:1fr;opacity:1}
.chip:hover .chip-drawer p,.chip.open .chip-drawer p,.chip:focus-visible .chip-drawer p,
.chip:hover .chip-drawer p::before,.chip.open .chip-drawer p::before,.chip:focus-visible .chip-drawer p::before{transform:none}
.hero-foot{display:flex;flex-wrap:wrap;align-items:center;gap:18px 36px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
/* stats: a row under the portrait, big numbers with a brass "+" */
.stats{display:flex;justify-content:center;margin-top:clamp(14px,2.6vh,30px)}
.stat{padding:2px clamp(16px,2.2vw,32px);text-align:center}
.stat+.stat{border-left:1px solid var(--line-strong)}
.stat-n{display:flex;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,3.6vw,52px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-n i{font-style:normal;color:var(--brass);font-size:.62em;margin:.04em 0 0 .06em}
.stat span{display:block;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ============ 2. EXPERIENCE (TIMELINE) ============ */
/* desktop: 14 columns, the line is the middle row; job i starts at column 2i+1 and spans 4, even jobs sit above the line, odd ones below.
   --nx: node position from the card's left edge, --stem: distance card ↔ line */
.tl{--stem:30px;--nx:30px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:auto calc(var(--stem) * 2) auto;column-gap:16px;position:relative}
.tl-line{grid-column:1/-1;grid-row:2;align-self:center;height:2px;background:var(--line-strong);position:relative;overflow:hidden}
.tl-line::after{content:"";position:absolute;top:0;left:-180px;height:2px;width:180px;background:linear-gradient(90deg,transparent,var(--verd),transparent);animation:busflow 6.8s linear infinite;animation-direction:reverse}
/* arrowhead at the start of the line: time runs towards the current job (left on desktop, up on mobile) */
.tl-arrow{grid-column:1;grid-row:2;align-self:center;justify-self:start;width:12px;height:12px;box-sizing:border-box;border:solid var(--line-strong);border-width:0 0 2px 2px;transform:translateX(1px) rotate(45deg)}
@keyframes busflow{from{left:-180px}to{left:100%}}
@keyframes busflowY{from{top:-180px}to{top:100%}}
.tl-item{grid-column:var(--c)/span 4;position:relative;display:flex}
.tl-item.up{grid-row:1}
.tl-item.down{grid-row:3}
.tl-item::before{content:"";position:absolute;left:var(--nx);width:1px;height:var(--stem);background:var(--line-strong);transition:background .4s}
.tl-item.up::before{top:100%}
.tl-item.down::before{bottom:100%}
.tl-node{position:absolute;z-index:1;left:calc(var(--nx) - 10.5px);width:22px;height:22px;border:1px solid var(--line-strong);background:var(--bg);display:grid;place-items:center;transform:rotate(45deg);transition:.4s}
.tl-node i{width:8px;height:8px;background:var(--brass);transition:.4s}
.tl-item.up .tl-node{top:calc(100% + var(--stem) - 11px)}
.tl-item.down .tl-node{bottom:calc(100% + var(--stem) - 11px)}
.tl-item.now .tl-node::after{content:"";position:absolute;inset:-7px;border:1px solid var(--verd);animation:ping 2s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.tl-year{position:absolute;left:calc(var(--nx) + 20px);font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--brass);white-space:nowrap;line-height:1}
.tl-item.up .tl-year{top:calc(100% + var(--stem) + 9px)}
.tl-item.down .tl-year{bottom:calc(100% + var(--stem) + 9px)}
.tl-item:hover::before{background:var(--verd)}
.tl-item:hover .tl-node{border-color:var(--verd);box-shadow:0 0 18px var(--verd)}
.tl-item:hover .tl-node i{background:var(--verd)}
.job{flex:1;min-width:0;padding:16px 18px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;display:flex;flex-direction:column;transition:transform .5s var(--ease-out),border-color .3s,box-shadow .3s}
.tl-item:hover .job{border-color:var(--brass);box-shadow:var(--shadow)}
.tl-item.up:hover .job{transform:translateY(-4px)}
.tl-item.down:hover .job{transform:translateY(4px)}
.job-head{display:flex;align-items:center;gap:12px}
.job-logo{flex:none;width:40px;height:40px;padding:6px;border-radius:8px;background:var(--logo-bg);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.job-logo img{max-width:100%;max-height:100%;display:block}
.job-logo.empty{background:none;box-shadow:none;border:1px dashed var(--line-strong)}
.job-logo.icon{background:var(--brass-soft);color:var(--brass);padding:6px}
.job-logo.icon svg{width:100%;height:100%;display:block;overflow:visible}
.job-logo.icon .spark{fill:var(--verd)}
.job h3{font-family:var(--f-display);font-size:clamp(15px,1.3vw,18px);font-weight:600;margin:0;line-height:1.15;min-width:0}
.job h3 small{display:block;margin-top:3px;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.job-when{display:none;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--brass)}
.job .company{margin-top:12px;font-size:13px;color:var(--verd);font-weight:600}
.job p{font-size:13.5px;color:var(--muted);line-height:1.5;margin:6px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11.5px;padding:3px 9px;border:1px solid var(--line-strong);border-radius:20px}
.job .tags{margin-top:auto}

/* ============ 3. SKILLS (KNOWLEDGE GRAPH) ============ */
.kn{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.85fr);gap:clamp(18px,2.6vw,40px);align-items:stretch}
.kn-stage,.kn-panel{height:clamp(340px,calc(100vh - 332px),700px)}
.kn-stage{position:relative;min-width:0}
.kn-stage::before{content:"";position:absolute;inset:2% 8%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--surface-solid) 78%,transparent),color-mix(in srgb,var(--surface-solid) 30%,transparent) 62%,transparent)}
#kgraph{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-x pan-y;cursor:grab;-webkit-tap-highlight-color:transparent}
#kgraph.over{cursor:pointer}
#kgraph.drag{cursor:grabbing}
.kn-br{position:absolute;width:18px;height:18px;border:1.5px solid var(--line-strong);pointer-events:none}
.kn-br.tl{top:0;left:0;border-right:0;border-bottom:0}.kn-br.tr{top:0;right:0;border-left:0;border-bottom:0}
.kn-br.bl{bottom:0;left:0;border-right:0;border-top:0}.kn-br.brr{bottom:0;right:0;border-left:0;border-top:0}
.kn-hud{position:absolute;top:12px;left:18px;display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none}
.kn-hud b{color:var(--ink);font-weight:600}
.kn-hud .kn-rot{color:rgba(var(--bit),.85)}
.kn-ctl{position:absolute;top:8px;right:10px;display:flex;gap:8px}
.kn-ctl .ibtn{width:36px;height:36px;background:var(--surface);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.kn-ctl .ibtn svg{width:16px;height:16px}
#knSpin .i-play{fill:currentColor;stroke:none;display:none}
#knSpin[aria-pressed="false"] .i-play{display:block}
#knSpin[aria-pressed="false"] .i-pause{display:none}
#knReset:hover svg{transform:rotate(-120deg)}
.kn-hint{position:absolute;right:16px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.kn-hint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--verd)}
.kn-card{--c:var(--k-auto);position:absolute;left:12px;bottom:12px;width:min(350px,calc(100% - 24px));max-height:calc(100% - 64px);overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;
  padding:14px 16px 16px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(var(--c),.55);border-radius:8px;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .55s var(--ease-out),border-color .4s,visibility 0s .55s}
.kn-card.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.kn-card-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kn-card-top .deg{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--brass);white-space:nowrap}
.kn-card-top .ibtn{width:28px;height:28px;flex:0 0 auto}
.kn-card-top .ibtn svg{width:14px;height:14px}
.kn-card h3{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,1.6vw,22px);line-height:1.15;margin:6px 0 12px}
.kn-dot{flex:0 0 auto;width:8px;height:8px;transform:rotate(45deg);background:rgb(var(--c));box-shadow:0 0 8px rgba(var(--c),.55)}
.kn-rel-l{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.kn-rel{display:flex;flex-wrap:wrap;gap:6px}
.kn-rel button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;font-size:12px;border:1px solid var(--line-strong);border-radius:20px;transition:border-color .25s,background .25s}
.kn-rel button .kn-dot{width:6px;height:6px;box-shadow:none}
.kn-rel button:hover{border-color:rgb(var(--c));background:rgba(var(--c),.1)}
.kn-rel button:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.kn-panel{display:flex;flex-direction:column;min-width:0}
.kn-panel .panel-bar b{font-family:var(--f-mono);font-weight:600;color:var(--brass)}
.kn-search{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:relative;cursor:text}
.kn-search::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--verd);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease-out)}
.kn-search:focus-within::after{transform:scaleX(1)}
.kn-search svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.kn-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font:inherit;font-size:14px;color:var(--ink);padding:3px 0;-webkit-appearance:none;appearance:none}
.kn-search input::placeholder{color:var(--muted)}
.kn-list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;scrollbar-width:thin;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 22px),transparent)}
.kn-sec{padding:10px 0 12px;border-bottom:1px dashed var(--line)}
.kn-sec:last-of-type{border-bottom:0}
.kn-sec-h{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;padding:3px 0 9px;font-weight:700;font-size:13.5px;line-height:1.25}
.kn-sec-h .kn-idx{font-family:var(--f-mono);font-size:11px;font-weight:600;color:rgb(var(--c));display:flex;align-items:center;gap:7px}
.kn-sec-h .kn-idx::before{content:"";width:9px;height:9px;transform:rotate(45deg);border:1.5px solid rgb(var(--c));transition:background .3s,box-shadow .3s}
.kn-sec-h .kn-n{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.kn-sec-h:hover .kn-sec-t,.kn-sec-h[aria-pressed="true"] .kn-sec-t{color:rgb(var(--c))}
.kn-sec-h[aria-pressed="true"] .kn-idx::before{background:rgb(var(--c));box-shadow:0 0 10px rgb(var(--c))}
.kn-sec-h:focus-visible{outline:1.5px dashed var(--verd);outline-offset:3px}
.kn-items{display:flex;flex-wrap:wrap;gap:6px}
.kn-it{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;font-size:12.5px;line-height:1.35;border:1px solid var(--line);border-radius:4px;background:color-mix(in srgb,var(--surface-solid) 60%,transparent);transition:border-color .25s,background .25s,box-shadow .25s,opacity .25s}
.kn-it::before{content:"";flex:0 0 auto;width:6px;height:6px;transform:rotate(45deg);background:rgb(var(--c))}
.kn-it.hub{font-weight:700;border-color:rgba(var(--c),.5)}
.kn-it:hover,.kn-it.hl{border-color:rgb(var(--c));background:rgba(var(--c),.1)}
.kn-it[aria-pressed="true"]{border-color:rgb(var(--c));background:rgba(var(--c),.2);box-shadow:0 0 0 3px rgba(var(--c),.14)}
.kn-it:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.kn-it[hidden],.kn-sec[hidden]{display:none}
.kn-empty{margin:18px 0;font-size:13px;color:var(--muted);text-align:center}

/* ============ 4. CERTIFICATES ============ */
.certs{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.72fr);gap:clamp(24px,3vw,48px);align-items:stretch}
.certs-main{display:flex;flex-direction:column;min-width:0}
/* details panel takes the whole column height, from the title down */
.certs-main .cert-stage{align-items:flex-start}
.certs-side{display:flex;flex-direction:column;min-width:0}
.certs-side .panel{flex:1;display:flex;flex-direction:column}
.certs-side .ci-body{flex:1;display:flex;flex-direction:column}
.certs-side .ci-btns{margin-top:auto}
.panel{border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;overflow:hidden}
.panel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ci-nav{display:flex;align-items:center;gap:6px}
.ci-nav>span{margin-right:4px}
.ci-arr{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;transition:color .25s,border-color .25s,transform .3s var(--ease-out)}
.ci-arr svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ci-arr:hover,.ci-arr:focus-visible{color:var(--brass);border-color:var(--brass)}
#ciPrev:hover{transform:translateX(-2px)}#ciNext:hover{transform:translateX(2px)}
.leds{display:flex;gap:6px}
.leds i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.leds i:nth-child(1){background:var(--verd);box-shadow:0 0 8px var(--verd);animation:blink 1.6s infinite}
.leds i:nth-child(2){background:var(--brass)}
.ci-body{padding:22px 20px}
.ci-id{font-family:var(--f-mono);font-size:12px;color:var(--brass)}
.ci-body h3{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,1.7vw,24px);margin:8px 0 16px;line-height:1.2;min-height:2.4em}
.ci-body dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 18px;font-size:13.5px}
.ci-body dt{color:var(--muted)}
.ci-body dd{margin:0;font-weight:600}
.ci-check{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line-strong);border-radius:6px;margin-bottom:18px;overflow:hidden;white-space:nowrap}
.ci-check .ok{color:var(--verd);font-weight:600;flex:0 0 auto}
.ci-check #ciHash{overflow:hidden;text-overflow:ellipsis}
.ci-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn[hidden]{display:none}
.cert-stage{height:clamp(300px,calc(100vh - 250px),720px);display:flex;align-items:center;justify-content:center}
.cert-gal{display:flex;gap:18px;align-items:center}
.cert-col{display:flex;flex-direction:column;gap:18px;align-items:center}
.cert{position:relative;perspective:1000px;cursor:pointer;outline-offset:8px}
.cert-in{position:absolute;inset:0;border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:3px;transition:transform .25s ease-out,box-shadow .4s,border-color .4s;overflow:hidden}
.cert:hover .cert-in,.cert.active .cert-in{border-color:var(--brass)}
.cert:hover .cert-in{box-shadow:var(--shadow)}
.cert .br{position:absolute;width:16px;height:16px;border:2px solid var(--brass);transition:transform .45s var(--ease-out);z-index:2;pointer-events:none;opacity:.8}
.cert .br.tl{top:-8px;left:-8px;border-right:0;border-bottom:0}
.cert .br.tr{top:-8px;right:-8px;border-left:0;border-bottom:0}
.cert .br.bl{bottom:-8px;left:-8px;border-right:0;border-top:0}
.cert .br.brr{bottom:-8px;right:-8px;border-left:0;border-top:0}
.cert:hover .br.tl{transform:translate(-5px,-5px)}.cert:hover .br.tr{transform:translate(5px,-5px)}
.cert:hover .br.bl{transform:translate(-5px,5px)}.cert:hover .br.brr{transform:translate(5px,5px)}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg2);border:1px solid var(--line-strong);z-index:2;transition:transform .6s var(--ease-out)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:1px;margin-top:-.5px;background:var(--muted)}
.screw.s1{top:8px;left:8px}.screw.s2{top:8px;right:8px}.screw.s3{bottom:8px;left:8px}.screw.s4{bottom:8px;right:8px}
.cert:hover .screw{transform:rotate(180deg)}
.cert-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.22),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.cert:hover .glare{opacity:1}

/* ============ 5. PROJECTS ============ */
.proj-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.car-ctrl{display:flex;align-items:center;gap:12px}
.gbtn{all:unset;cursor:pointer;width:52px;height:52px;display:grid;place-items:center;position:relative;border-radius:50%}
.gbtn .g{position:absolute;inset:0;width:100%;height:100%;color:var(--line-strong);transition:color .3s}
.gbtn:hover .g{color:var(--brass)}
.gbtn .ar{width:18px;height:18px;position:relative;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.car-count{font-family:var(--f-mono);font-size:13px;min-width:64px;text-align:center}
.car-count b{color:var(--brass);font-weight:600}
.carousel{position:relative;height:calc(min(470px,76vw) * 9 / 16 + 198px);margin-top:clamp(14px,2.4vh,26px);perspective:1800px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pcard{--w:min(470px,76vw);position:absolute;top:0;left:50%;width:var(--w);height:100%;margin-left:calc(var(--w) / -2);transition:transform .9s var(--ease-out),opacity .7s,filter .7s;will-change:transform;outline-offset:6px}
.carousel.dragging .pcard{transition:transform .12s linear,opacity .3s}
.pc-in{position:relative;height:100%;display:flex;flex-direction:column;border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:12px;overflow:hidden;transition:transform .3s ease-out,box-shadow .5s;cursor:pointer}
.pcard.center .pc-in{box-shadow:var(--shadow),0 0 0 1px var(--brass-soft)}
.pcard.center::before{content:"";position:absolute;inset:-2px;border-radius:14px;padding:2px;background:conic-gradient(from var(--ang),var(--brass),transparent 28%,var(--verd) 50%,transparent 78%,var(--brass));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:angspin 5s linear infinite;z-index:2;pointer-events:none}
@keyframes angspin{to{--ang:360deg}}
.pc-media{position:relative;flex:none;aspect-ratio:16/9;overflow:hidden;background:var(--bg2)}
.ph-media{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
  background:linear-gradient(135deg,var(--brass-soft),var(--verd-soft)),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px;
  transition:transform 1.2s var(--ease-out)}
.pcard.center:hover .ph-media{transform:scale(1.06)}
.pc-media .shot,.m-screen .shot,.thumbs .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease-out)}
.pcard.center:hover .pc-media .shot{transform:scale(1.04)}
.m-screen.real{max-height:62vh}
.m-screen.real .shot{object-fit:contain}
.m-screen.real,.cm .cert-big{cursor:zoom-in}
/* full-screen shot viewer: wheel / buttons / double click / pinch zoom, drag to pan */
.zoomer{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fxswap .3s var(--ease-out)}
.zoomer[hidden]{display:none}
.zm-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:zoom-in}
.zm-stage.zoomed{cursor:grab}.zm-stage.drag{cursor:grabbing}
.zm-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none}
.zm-stage:not(.drag) img{transition:transform .25s var(--ease-out)}
.zm-ctl{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface-solid);box-shadow:var(--shadow)}
.zm-ctl .ibtn{width:36px;height:36px}
.zm-val{min-width:48px;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ph-media svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.badge{position:absolute;top:12px;left:12px;font-size:11.5px;padding:4px 10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;z-index:1}
.play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:1}
.play::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--ink);animation:ping 2.2s var(--ease-out) infinite}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none;opacity:1;margin-left:3px}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;height:3px;background:var(--line-strong);border-radius:2px;overflow:hidden;z-index:1}
.vbar i{position:absolute;inset:0;background:var(--verd);transform-origin:left;animation:vprog 7s linear infinite}
@keyframes vprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pc-body{padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.pc-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;color:var(--muted)}
.pc-meta h3{min-width:0}
.pc-meta .cat{flex:0 0 auto;white-space:nowrap}
.pc-body h3{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.5vw,21px);margin:0;line-height:1.2}
.pc-body p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc-open{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pc-open svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .4s var(--ease-out)}
.pcard.center:hover .pc-open svg{transform:rotate(90deg)}
.pcard:not(.center) .pc-open{opacity:0}
.conveyor{position:relative;height:30px;margin:clamp(12px,2vh,22px) auto 0;max-width:620px}
.belt{position:absolute;left:30px;right:30px;top:7px;height:16px;border-radius:8px;border:1px solid var(--line-strong);
  background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 14px);transition:background-position 1s var(--ease-out)}
.conveyor .cg{position:absolute;top:0;width:30px;height:30px;color:var(--brass)}
.conveyor .cg.l{left:0}.conveyor .cg.r{right:0}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px;background:var(--bg);padding:0 8px}
.dots button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;width:16px;text-align:center;color:var(--muted);transition:color .3s}
.dots button.active{color:var(--verd);font-weight:600}

/* ============ 6. CONTACT ============ */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(26px,5vw,80px);align-items:center}
.term{border:1px solid var(--line-strong);background:var(--surface-solid);border-radius:8px;overflow:hidden;margin-top:26px;max-width:480px}
.term-body{padding:16px 18px;font-family:var(--f-mono);font-size:13px;line-height:2}
.term-body .p{color:var(--brass)}
.term-body a{color:var(--verd);text-decoration:none;border-bottom:1px dashed transparent;transition:border-color .3s}
.term-body a:hover{border-bottom-color:var(--verd)}
.term-body .cur{display:inline-block;width:8px;height:14px;background:var(--verd);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.socials{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.soc{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line-strong);border-radius:40px;font-size:13.5px;font-weight:600;transition:border-color .3s,color .3s}
.soc:hover{border-color:var(--brass);color:var(--brass)}
.soc svg{width:16px;height:16px;flex:none}
.tx{position:relative}
.tx form{padding:22px 22px 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field.req label::after{content:" *";color:var(--brass)}
.field input,.field textarea{box-sizing:border-box;width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:11px 14px;font:inherit;font-size:15px;line-height:1.4;color:var(--ink);outline:none;resize:vertical;transition:border-color .25s,box-shadow .25s}
.field textarea{height:130px;min-height:90px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.field input:hover,.field textarea:hover{border-color:var(--muted)}
.field input:focus,.field textarea:focus{border-color:var(--verd);box-shadow:0 0 0 3px var(--verd-soft)}
.field.err input,.field.err textarea{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 15%,transparent)}
.field .ferr{display:none;font-size:12px;color:var(--danger)}
.field.err .ferr{display:block}
.field.err{animation:shake .45s}
/* privacy checkbox: the link inside the label opens the policy and does not toggle the box */
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--ink);cursor:pointer}
.chk input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--verd);cursor:pointer}
.chk button{color:var(--ink)}
.field.err .chk input{outline:2px solid var(--danger);outline-offset:2px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.flabel{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.send{all:unset;cursor:pointer;box-sizing:border-box;position:relative;overflow:hidden;width:100%;padding:16px 20px;border-radius:40px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;transition:box-shadow .3s}
.send:hover{box-shadow:0 0 0 4px var(--brass-soft),0 14px 30px -12px var(--brass)}
.send .fill{position:absolute;inset:0;background:var(--verd);transform:scaleX(0);transform-origin:left}
.send.sending .fill{transition:transform 2s var(--ease);transform:scaleX(1)}
.send .lbl{position:relative;display:flex;align-items:center;gap:10px}
.send .plane{width:20px;height:20px;color:var(--brass);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease-out)}
.send:hover .plane{transform:translate(3px,-3px)}
.send.sending .plane{animation:planeFly 1s var(--ease-out) infinite}
@keyframes planeFly{0%{transform:none;opacity:1}55%{transform:translate(18px,-18px);opacity:0}56%{transform:translate(-14px,14px);opacity:0}100%{transform:none;opacity:1}}
.send.sending svg{color:var(--bg)}
.tx-done{position:absolute;inset:44px 0 0 0;background:var(--surface-solid);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:10px;clip-path:inset(0 0 100% 0);transition:clip-path .8s var(--ease)}
.tx.done .tx-done{clip-path:inset(0 0 0 0)}
.tx-done svg.big{width:92px;height:92px;color:var(--verd)}
.tx-done h3{font-family:var(--f-display);font-size:24px;margin:6px 0 0}
.tx-done p{color:var(--muted);margin:0;max-width:34ch;font-size:14px}

/* ============ SHUTTER TRANSITION ============ */
.shutter{position:fixed;inset:0;z-index:80;pointer-events:none}
.shutter.closing,.shutter.boot{pointer-events:auto}
.sh{position:absolute;top:0;bottom:0;width:calc(50% + 12px);overflow:hidden;will-change:transform}
.sh-l{left:0;transform:translateX(-103%)}
.sh-r{right:0;transform:translateX(103%)}
.sh-face{position:absolute;top:0;bottom:0;background:var(--sh);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px),linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%,rgba(0,0,0,.25))}
.sh-l .sh-face{left:0;right:24px}.sh-r .sh-face{right:0;left:24px}
.sh-teeth{position:absolute;top:0;bottom:0;width:24px;background:repeating-linear-gradient(180deg,var(--sh) 0 26px,transparent 26px 52px)}
.sh-l .sh-teeth{right:0}
.sh-r .sh-teeth{left:0;background-position:0 26px}
.sh-rivets{position:absolute;top:0;bottom:0;width:10px;background:radial-gradient(circle,rgba(255,255,255,.18) 2.5px,transparent 3px) 0 0/10px 34px}
.sh-l .sh-rivets{right:44px}.sh-r .sh-rivets{left:44px}
.sh-hazard{position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(45deg,var(--brass) 0 8px,transparent 8px 16px);opacity:.55}
.sh-l .sh-hazard{right:62px}.sh-r .sh-hazard{left:62px}
.sh-code{position:absolute;inset:0;font-family:var(--f-mono);font-size:11px;line-height:1.7;color:rgba(var(--bit),.16);white-space:pre;overflow:hidden;padding:20px;word-break:break-all}
.sh-label{position:absolute;top:calc(50% - 205px);width:100vw;text-align:center;color:var(--sh-ink);pointer-events:none}
.sh-l .sh-label{left:0}.sh-r .sh-label{right:0}
.sh-label .k{font-family:var(--f-mono);font-size:12px;color:rgba(var(--bit),.9);letter-spacing:.2em;display:block;margin-bottom:10px}
.sh-label .w{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,110px);line-height:1;white-space:nowrap}
.sh-sub{position:absolute;top:calc(50% + 100px);width:100vw;text-align:center;font-family:var(--f-mono);font-size:12px;color:rgba(228,233,238,.55)}
.sh-l .sh-sub{left:0}.sh-r .sh-sub{right:0}
.shutter.closing .sh-l,.shutter.closing .sh-r{transform:none;transition:transform .6s var(--ease)}
.shutter.opening .sh-l{transform:translateX(-103%);transition:transform .75s var(--ease)}
.shutter.opening .sh-r{transform:translateX(103%);transition:transform .75s var(--ease)}
.shutter.boot .sh-l,.shutter.boot .sh-r{transform:none;transition:none}
.lock{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:0;color:var(--brass)}
.lock svg{width:100%;height:100%;overflow:visible}
.lock .core{fill:var(--sh);stroke:rgba(var(--bit),.8);stroke-width:1.5}
.shutter.closing .lock,.shutter.boot .lock{animation:lockIn .55s .2s var(--ease-out) both}
.shutter.opening .lock{animation:lockOut .5s var(--ease) both}
@keyframes lockIn{from{opacity:0;transform:scale(.3) rotate(-140deg)}to{opacity:1;transform:none}}
@keyframes lockOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.7) rotate(140deg)}}
.sh-flash{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--verd);box-shadow:0 0 30px 4px var(--verd);opacity:0}
.shutter.closing .sh-flash{animation:flash .5s .5s}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.boot-bar{position:absolute;left:50%;top:calc(50% + 130px);width:220px;margin-left:-110px;height:2px;background:rgba(255,255,255,.1);opacity:0}
.boot-bar i{position:absolute;inset:0;background:var(--verd);transform-origin:left;transform:scaleX(0)}
.shutter.boot .boot-bar{opacity:1}
.shutter.boot .boot-bar i{animation:vprog 1.1s var(--ease) forwards}

/* ============ MODALS ============ */
.modal{position:fixed;inset:0;z-index:90;display:none}
.modal.show{display:block}
.m-back{position:absolute;inset:0;background:rgba(10,14,19,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .5s}
.modal.open .m-back{opacity:1}
.m-panel{position:absolute;left:50%;top:50%;max-height:calc(100% - 8vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:min(1180px,92vw);transform:translate(-50%,-50%);background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:clip-path .75s var(--ease)}
.m-head{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head .gear-sm{width:30px;height:30px;color:var(--brass);flex:0 0 auto}
.m-head .ttl{flex:1;min-width:0}
.m-head .ttl small{font-size:12px;color:var(--muted);display:block}
.m-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.8vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-actions{display:flex;gap:8px}
.ibtn{all:unset;cursor:pointer;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;transition:.3s}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .5s var(--ease-out)}
.ibtn:hover{border-color:var(--brass);color:var(--brass)}
.ibtn.x:hover svg{transform:rotate(90deg)}
.m-body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.m-media{padding:20px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.m-screen{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);background:var(--bg2)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs button{all:unset;cursor:pointer;position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;border:1px solid var(--line);transition:border-color .3s}
.thumbs button.active{border-color:var(--brass)}
.thumbs .ph-media svg{width:22px;height:22px}
.m-info{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.m-lead{font-size:15.5px;margin:0;max-width:60ch}
.tabs{position:relative;display:flex;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--muted);transition:color .3s}
.tabs button.active{color:var(--ink)}
.tabs .ind{position:absolute;bottom:-1px;left:0;height:2px;width:33.333%;background:var(--brass);transition:transform .6s var(--ease)}
.tab-view{overflow:hidden}
.tab-track{display:flex;transition:transform .7s var(--ease)}
.tab-track>div{flex:0 0 100%;font-size:14px;color:var(--muted);padding-right:4px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{padding:12px;border:1px solid var(--line);border-radius:8px}
.metric b{font-family:var(--f-display);font-size:22px;display:block;color:var(--verd)}
.metric span{font-size:12px;color:var(--muted)}
.m-links{display:flex;gap:10px;flex-wrap:wrap}
.metrics[hidden],.m-links[hidden]{display:none}
.modal.open .stag{animation:a-up .8s var(--ease-out) both;animation-delay:calc(var(--d,0) * 70ms + 380ms)}
.stag{opacity:0}
.cm .m-panel{width:auto;max-width:92vw;display:flex;flex-direction:column}
/* legal texts (Impressum / Datenschutz): one readable column */
.lm .m-panel{width:min(820px,92vw)}
.lm .m-body{display:block;padding:22px clamp(18px,3vw,36px) 30px;font-size:14.5px;line-height:1.65}
.lg h4{font-family:var(--f-display);font-weight:600;font-size:16px;margin:22px 0 6px}
.lg h4:first-child{margin-top:0}
.lg p{margin:0 0 10px;color:var(--muted)}
.lg a{color:var(--verd)}
.lg-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.lg-note:empty{display:none}
.cm .m-body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg2)}
.cm .cert-big{position:relative;border:1px solid var(--line-strong);background:#fff;border-radius:4px;overflow:hidden}

/* ============ CURSOR ============ */
.cursor{display:none}
@media (pointer:fine){
  .cursor{display:block;position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .4s}
  .cursor.live{opacity:1}
  .cursor.live.off{opacity:0;transition-duration:.15s}
  .c-dot,.c-ring-w{position:fixed;left:0;top:0;will-change:transform}
  .c-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--brass)}
  .c-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--line-strong);border-radius:50%;transition:width .35s var(--ease-out),height .35s var(--ease-out),margin .35s var(--ease-out),border-color .3s}
  .cursor.hover .c-ring{width:58px;height:58px;margin:-29px 0 0 -29px;border:1.5px dashed var(--verd);animation:orbit 4s linear infinite}
  .cursor.down .c-ring{width:24px;height:24px;margin:-12px 0 0 -12px}
}

/* ============ RESPONSIVE ============ */
@media (max-width:1360px){
  .nav-inner{gap:16px}
  .menu button{padding:0 11px;font-size:13px}
}
@media (max-width:1100px){
  .menu{display:none}
  .prefs.nav-dd{display:flex}
  .kn{grid-template-columns:minmax(0,1.3fr) minmax(270px,1fr)}
}
@media (max-width:860px){
  :root{--nav-h:60px}
  .logo span{display:none}
  .nav-inner{gap:10px}
  .hud-r{display:none}
  .slide-scroll{justify-content:flex-start;--top-gap:14px}
  .hero,.contact,.certs{grid-template-columns:1fr}
  .portrait{--s:min(84vw,380px)}
  /* callouts move into the empty corners of the square, clear of the photo and the play button */
  .callout{font-size:11.5px;padding:6px 11px}
  .callout.c1{top:-1%;right:-4%}.callout.c2{bottom:-4%;left:-4%}
  .chips{grid-template-columns:1fr;gap:18px}
  .cert-stage{height:min(62vh,440px)}
  .m-body{grid-template-columns:1fr}
  .m-media{border-right:0;border-bottom:1px solid var(--line)}
  /* project details take the whole screen: more room for the shots and texts */
  .pm .m-panel{inset:0;width:auto;max-height:none;transform:none;border:0;border-radius:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
  .ghost-num{display:none}
  .kn{grid-template-columns:1fr}
  /* timeline turns vertical: the line in the middle, jobs alternate left / right and overlap by half a card */
  .tl{--stem:16px;--ny:24px;grid-template-columns:1fr 1fr;grid-template-rows:none;column-gap:calc(var(--stem) * 2);row-gap:12px}
  .tl-line{position:absolute;grid-area:auto;align-self:stretch;left:calc(50% - 1px);top:0;bottom:0;width:2px;height:auto}
  .tl-line::after{left:0;top:-180px;width:2px;height:180px;background:linear-gradient(180deg,transparent,var(--verd),transparent);animation-name:busflowY}
  .tl-arrow{position:absolute;grid-area:auto;left:50%;top:0;transform:translate(-50%,1px) rotate(135deg)}
  .tl-item.up,.tl-item.down{grid-row:var(--r)/span 2;align-self:start}
  .tl-item.up{grid-column:1}.tl-item.down{grid-column:2}
  .tl-item::before,.tl-item.up::before,.tl-item.down::before{top:var(--ny);bottom:auto;width:var(--stem);height:1px}
  .tl-item.up::before{left:100%}.tl-item.down::before{left:auto;right:100%}
  .tl-item.up .tl-node,.tl-item.down .tl-node{top:calc(var(--ny) - 11px);bottom:auto}
  .tl-item.up .tl-node{left:calc(100% + var(--stem) - 11px)}.tl-item.down .tl-node{left:auto;right:calc(100% + var(--stem) - 11px)}
  .tl-year{display:none}
  .tl-item.up:hover .job,.tl-item.down:hover .job{transform:none}
  .job{position:relative;padding:24px 10px 12px}
  /* name to the right of the logo, like on desktop; the year is pinned to the card's top right corner */
  .job-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:3px;align-items:center}
  .job-logo{width:32px;height:32px;padding:5px}
  .job h3{font-size:13.5px;overflow-wrap:break-word}
  .job h3 small{font-size:11px}
  .job-when{display:block;position:absolute;top:8px;right:10px;font-size:11px;line-height:1}
  .job .company{margin-top:8px;font-size:12.5px}
  .job p{font-size:13px}
  .tags span{font-size:11px;padding:2px 8px}
  .kn-stage{height:min(62vh,440px)}
  .kn-panel{height:auto}
  .kn-list{overflow:visible;-webkit-mask-image:none;mask-image:none}
  .kn-card{max-height:calc(100% - 60px)}
  .kn-card.show~.kn-hint{opacity:0}
}
@media (max-width:520px){
  .logo b{font-size:13px}
  .stat{padding:2px 14px}
  .kn-hud{left:12px;top:10px;flex-direction:column}
  .kn-hud .kn-rot{display:none}
  .kn-card{left:8px;bottom:8px;width:calc(100% - 16px);padding:12px 14px 14px}
  /* the pager spans the bottom edge, names shrink with an ellipsis */
  .bar{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .pager{gap:8px}
  .pg{min-width:0;flex:0 1 auto;height:40px;gap:7px;font-size:12.5px;padding:0 12px 0 4px}
  .pg-next{padding:0 4px 0 12px}
  .pg-n b{display:none}
  .legal{font-size:11.5px}
  /* narrow cards wrap the description into more lines */
  .carousel{height:calc(min(470px,76vw) * 9 / 16 + 248px)}
  .pc-body p{-webkit-line-clamp:6}
}
/* narrow phones: one column of cards right of the line, the year sits left of each node */
@media (max-width:419.98px){
  .tl{--yw:52px;grid-template-columns:minmax(0,1fr);padding-left:calc(var(--yw) + var(--stem))}
  .tl-line{left:calc(var(--yw) - 1px)}
  .tl-arrow{left:var(--yw)}
  .tl-item.up,.tl-item.down{grid-column:1;grid-row:auto}
  .tl-item.up::before,.tl-item.down::before{left:auto;right:100%}
  .tl-item.up .tl-node,.tl-item.down .tl-node{left:auto;right:calc(100% + var(--stem) - 11px)}
  .tl-year,.tl-item.up .tl-year,.tl-item.down .tl-year{display:block;left:auto;bottom:auto;right:calc(100% + var(--stem) + 19px);top:var(--ny);transform:translateY(-50%);font-size:12px}
  .job{padding-top:12px}
  .job-when{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ============ READABILITY SCRIM ============ */
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 52% 54%,color-mix(in srgb,var(--bg) 72%,transparent) 0%,color-mix(in srgb,var(--bg) 40%,transparent) 50%,transparent 82%)}
.fx-swap{animation:fxswap .5s var(--ease-out)}
@keyframes fxswap{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
/* ============ LANGUAGE SWITCH ============ */
.nav-right{display:flex;align-items:center;gap:12px}
/* language + theme: one panel, two dropdowns */
.prefs{display:flex;align-items:center;padding:3px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface)}
.prefs-sep{width:1px;height:16px;margin:0 2px;background:var(--line-strong)}
.dd{position:relative}
.dd-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 11px;border-radius:20px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--ink);transition:background .3s}
.dd-btn:hover,.dd.open .dd-btn{background:var(--brass-soft)}
.dd-btn:focus-visible{outline:1.5px dashed var(--verd);outline-offset:2px}
.dd-val{display:flex;align-items:center}
.dd svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dd-btn .dd-car{width:10px;height:10px;color:var(--muted);transition:transform .35s var(--ease-out)}
.dd.open .dd-car{transform:rotate(180deg)}
.dd-menu{position:absolute;z-index:60;right:-4px;top:calc(100% + 12px);min-width:190px;padding:6px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-solid);box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .4s var(--ease-out),visibility 0s .4s}
.dd.open .dd-menu{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .4s var(--ease-out)}
.dd-menu::before{content:"";position:absolute;left:14px;right:14px;top:-7px;height:5px;background:repeating-linear-gradient(90deg,var(--brass) 0 4px,transparent 4px 10px);opacity:.6}
.dd-menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.dd-menu button b{width:20px;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--brass)}
.dd-menu button svg{color:var(--brass)}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--brass-soft);color:var(--ink)}
.dd-menu button[aria-checked="true"]{color:var(--ink)}
.dd-menu button[aria-checked="true"]::after{content:"";width:7px;height:7px;margin:0 3px 0 auto;flex:none;transform:rotate(45deg);background:var(--verd);box-shadow:0 0 10px var(--verd)}
</style>
<script>try{var m=localStorage.getItem('pf-theme');if(m=='light'||m=='dark')document.documentElement.dataset.theme=m}catch(e){}</script>

    'prj.drafta.d':'SaaS для малого и среднего бизнеса: AI готовит черновики ответов клиентам во всех мессенджерах и соцсетях, остаётся нажать «Отправить».',
    'prj.drafta.lead':'drafta — SaaS-приложение для малого и среднего бизнеса, которое упрощает общение с клиентами. Оно берёт на себя работу агента, который ведёт соцсети и мессенджеры компании: готовит ответы и публикует контент.',
    'prj.drafta.p0':'Клиенты пишут малому бизнесу в Telegram, WhatsApp, Instagram, Facebook, на почту и в чат на сайте. Владельцу приходится переключаться между приложениями и отвечать на каждое сообщение вручную, а на соцсети времени не остаётся.',
    'prj.drafta.p1':'Все каналы подключаются к одному окну. На каждый запрос AI (Mistral, OpenAI) готовит черновик ответа с учётом контекста бизнеса: календаря, таблиц и базы знаний. В том же приложении можно создавать посты и публиковать их прямо в соцсетях. Стек: Next.js и Supabase.',
    'prj.drafta.p2':'Пользователю остаётся проверить черновик и нажать одну кнопку, чтобы отправить сообщение. Окончательное решение всегда за человеком, а переписка и публикации во всех каналах ведутся из одного места.',
    'prj.drafta.s0':'Приложение drafta на ноутбуке и телефоне: список диалогов, переписка и AI-черновик ответа',
    'prj.drafta.s1':'Диалог с клиентом в WhatsApp и готовый AI-черновик ответа над полем ввода',
    'prj.drafta.s2':'Настройки базы знаний: разделы, из которых AI берёт факты, и бюджет токенов',
    'prj.drafta.s3':'Схема drafta: каналы клиентов, контекст бизнеса и окончательное решение за владельцем',
    'prj.mira.d':'AI-ассистент для поиска путешествий: пишете в чат, куда и с каким бюджетом хотите поехать, а агенты подбирают перелёты и отели.',
    'prj.mira.lead':'Mira — чат-бот на основе искусственного интеллекта для планирования поездок. Пользователь своими словами описывает, куда хочет поехать, на сколько человек, с каким бюджетом и пожеланиями, а AI-агенты ищут подходящие перелёты и отели.',
    'prj.mira.p0':'Чтобы спланировать поездку, приходится часами сравнивать перелёты и отели на разных сайтах, заново вводить одни и те же параметры в фильтры и сводить варианты в голове.',
    'prj.mira.p1':'Логика построена на n8n: агент-оркестратор собирает параметры поездки, уточняет недостающие данные и запускает отдельных агентов поиска перелётов и отелей. Модели — OpenAI и Mistral. Качество ответов проверяется автоматическими оценками на тестовом наборе. Интерфейс чата — Next.js, данные — Supabase, интеграции с HubSpot и Telegram.',
    'prj.mira.p2':'Вместо поиска по фильтрам — разговор: пользователь получает до пяти подходящих вариантов перелётов и отелей с ценой, рейтингом, условиями и коротким объяснением, почему выбран именно этот вариант.',
    'prj.mira.s0':'Лендинг Mira: пример диалога с AI-ассистентом о поездке',
    'prj.mira.s1':'Чат Mira с найденными перелётами: цена, рейсы туда и обратно, багаж и условия',
    'prj.mira.s2':'Сценарий в n8n: оркестратор, агенты поиска перелётов и отелей и блок оценки качества',
    'prj.mira.s3':'Чат Mira с найденными отелями: цена за поездку, рейтинг, питание и условия',
    'prj.fairplate.d':'Портал для Spirit GmbH: клиент загружает макет упаковки и за несколько кликов получает площади по цветам и стоимость флексоклише.',
    'prj.fairplate.lead':'Spirit FairPlate Shop — онлайн-портал, который я разработал по заказу компании Spirit GmbH, производителя флексоклише для печати на гофрокартоне. Клиент загружает макет упаковки, а система сама раскладывает его по цветам, считает площадь каждого цвета и рассчитывает стоимость заказа.',
    'prj.fairplate.p0':'Цена флексоклише зависит от площади печатной формы под каждый цвет макета. Клиентам Spirit — производителям упаковки — нужно быстро узнать эту цену, чтобы ответить своему заказчику, а разбирать макет и считать площади вручную долго.',
    'prj.fairplate.p1':'Портал на Next.js и TypeScript с базой PostgreSQL на собственном сервере. Загруженный макет автоматически разделяется на цвета, для каждого цвета вычисляется площадь, и по ней формируется стоимость. Расчёт можно сохранить и оформить заказ, когда заказчик подтвердит его, а без регистрации — загрузить файл или взять тестовые данные и получить демо-расчёт на почту.',
    'prj.fairplate.p2':'Вместо ручного запроса — несколько кликов: клиент загружает шаблон продукта и сразу получает подробный разбор технических площадей по цветам и стоимость заказа.',
    'prj.fairplate.s0':'Главная страница Spirit FairPlate Shop: заказ смонтированных и несмонтированных флексоклише онлайн',
    'prj.fairplate.s1':'Видеоинструкция к калькулятору: готовое ценовое предложение с выбранными цветами и расчётной стоимостью',
    'prj.cards.d':'AI-ассистент для продавцов: из любительского фото товара делает готовую карточку для Amazon, Etsy, eBay или Shopify.',
    'prj.cards.lead':'Чат-бот, который превращает сырую фотографию товара в готовую карточку для маркетплейса. Достаточно отправить снимок — например, слегка помятое платье на кровати, — и ассистент сгенерирует профессиональные фото, заголовок и описание товара.',
    'prj.cards.p0':'Чтобы выставить товар на маркетплейс, продавцу нужны качественные фотографии, продающий заголовок и описание с ключевыми характеристиками. Фотосессия с моделью и тексты под требования каждой площадки отнимают время и деньги, особенно когда товаров много.',
    'prj.cards.p1':'Пользователь загружает фото в чат, а ассистент распознаёт товар, генерирует серию изображений — на нейтральном фоне, в интерьере и на модели, которая его «примерила», — и пишет заголовок, описание и список ключевых особенностей. Кнопками выбирается площадка, под которую готовится карточка: Amazon, Etsy, eBay, Shopify и другие, а также язык: английский, немецкий или русский. Стек: React, модели Gemini через API, хостинг на Vercel.',
    'prj.cards.p2':'Из одного любительского снимка за несколько минут получается готовая карточка товара: набор фотографий, заголовок и описание, которые можно скачать или отредактировать перед публикацией.',
    'prj.cards.s0':'Карточка товара для Etsy: из фото платья на кровати сгенерированы снимки на модели, заголовок и описание',
    'prj.cards.s1':'Карточка товара для Amazon: микроволновая печь с новыми фото и списком ключевых особенностей',
    'prj.cards.s2':'Карточка товара для Shopify: кроссовки на модели в городском образе',
    'prj.cards.s3':'Карточка товара для eBay на русском: скутер с фото на улице и характеристиками',
    'prj.oliva.d':'Голосовой ассистент для ресторана: отвечает на звонки, бронирует столики и принимает заказы на вынос, а сложные вопросы передаёт сотруднику.',
    'prj.oliva.lead':'Голосовой AI-ассистент и портал для ресторана. Гость звонит по обычному номеру ресторана, а ассистент отвечает на вопросы, бронирует столик или оформляет заказ на вынос. Всё, что он делает, сразу попадает в портал ресторана, связанный и с ассистентом, и с сайтом.',
    'prj.oliva.p0':'В часы пик сотрудники ресторана не успевают отвечать на звонки: гости не могут дозвониться, чтобы забронировать столик или заказать еду, и ресторан теряет заказы. Брони и заказы при этом приходят из разных каналов — по телефону, через сайт и в самом зале — и их нужно сводить вручную.',
    'prj.oliva.p1':'Голосовой ассистент принимает звонки на номер ресторана: отвечает на вопросы гостей, бронирует столики и принимает заказы на вынос. Если он не может выполнить действие или ответить на вопрос, звонок переводится на сотрудника. Вторая часть проекта — портал ресторана: сайт для гостей с меню, бронированием и заказом на вынос и панель для персонала со схемой зала, бронями и заказами из всех каналов в реальном времени. Стек: голос — LiveKit и ElevenLabs, портал — Next.js и PostgreSQL на собственном сервере.',
    'prj.oliva.p2':'Ресторан отвечает на каждый звонок, даже когда персонал занят. Брони и заказы от голосового ассистента, с сайта и из зала собираются в одном месте, а у каждой записи видно, из какого канала она пришла.',
    'prj.oliva.s0':'Схема работы: гость звонит, голосовой ассистент отвечает на вопросы, бронирует столик или принимает заказ, а при необходимости передаёт звонок сотруднику',
    'prj.oliva.s1':'Панель ресторана: схема зала и заказы в реальном времени с отметкой канала — телефонный бот, сайт или ресторан',
    'prj.oliva.s2':'Бронирование столиков: схема зала, карточка брони от Telegram-бота и список предстоящих бронирований',
    'prj.oliva.s3':'Сайт ресторана для гостей: меню, бронирование столика и заказ на вынос',
    'prj.lingvy.d':'Приложение для изучения немецкого по книгам и фильмам: чтение с переводом, аудиопересказы, личный словарь и упражнения со словами.',
    'prj.lingvy.lead':'Lingvy — Telegram Mini App для изучения иностранного языка на текстах по мотивам известных книг и фильмов. Пользователь читает и слушает истории, переводит незнакомые слова, собирает их в личный словарь и закрепляет в упражнениях.',
    'prj.lingvy.p0':'Учебники и приложения с карточками быстро надоедают: слова заучиваются вне контекста и так же быстро забываются. Хотелось, чтобы язык можно было учить на интересных историях и при этом тренировать сразу чтение, восприятие на слух и словарный запас.',
    'prj.lingvy.p1':'В приложении есть библиотека текстов по мотивам книг и фильмов, разбитых на главы. При чтении можно выделить слово или фразу, увидеть перевод и одним нажатием добавить слово в словарь. Тексты можно не только читать, но и слушать в виде аудиопересказов, а в разделе видео — смотреть ролики с немецкими субтитрами. Слова из словаря закрепляются в заданиях: вставить слово в предложение, прослушать и написать его. Стек: Telegram Mini App на React, данные в Supabase, хостинг на Vercel.',
    'prj.lingvy.p2':'Пользователь учит язык на историях, которые ему интересны, а не на отдельных словах. В одном приложении тренируются чтение, аудирование и запоминание слов, а словарный запас пополняется прямо во время чтения.',
    'prj.lingvy.s0':'Lingvy на трёх экранах: библиотека книг, чтение главы с переводом фразы и упражнение со словом',
    'prj.lingvy.s1':'Чтение главы: выделенная фраза и её перевод на русский, внизу — плеер аудиопересказа',
    'prj.lingvy.s2':'Раздел видео: короткие ролики и видео с немецкими субтитрами',
    'prj.lingvy.s3':'Упражнение: прослушать слово и написать его по-немецки с артиклем',
    'prj.benefita.d':'Кооперативная программа лояльности для местного бизнеса: баллы, заработанные в одном заведении, тратятся на скидки в других.',
    'prj.benefita.lead':'Benefita — платформа, которая объединяет местные заведения в общую программу лояльности. Пользователь зарабатывает баллы, выполняя задания в одних заведениях, и тратит их на скидки и подарки в других, а бизнес получает новых клиентов от партнёров по сети без рекламного бюджета.',
    'prj.benefita.p0':'Малому бизнесу сложно привлекать новых клиентов: реклама дорогая, а собственная программа лояльности удерживает только тех, кто уже пришёл. Кафе, салону или мастерской нужен способ получать клиентов от соседних заведений и мотивировать их возвращаться.',
    'prj.benefita.p1':'Пользователь находит заведения в витрине приложения и выполняет задания за баллы. Самое простое — прийти в заведение и отсканировать NFC-чип на стойке, чтобы отметить визит. Есть и другие задания: опубликовать пост о заведении в соцсетях, подписаться на аккаунт, пригласить друга, подключить уведомления. Баллы обмениваются на скидки и подарки, которые предлагают заведения-участники. Стек: Next.js, Supabase, приложение работает как PWA — без установки из магазина.',
    'prj.benefita.p2':'Клиенты одного заведения узнают о других и приходят к ним за скидками, а каждый визит и каждая публикация в соцсетях приносят бизнесу новую аудиторию. Для пользователя это единая программа бонусов по всему городу вместо десятка отдельных карт.',
    'prj.benefita.s0':'Benefita на ноутбуке и телефоне: сайт для бизнеса и витрина заведений с предложениями',
    'prj.benefita.s1':'Раздел баллов: задания для заработка баллов — email, Instagram, уведомления, приглашение друга, пост о заведении',
    'prj.benefita.s2':'Витрина: заведения-участники и их скидки и подарки за баллы',
