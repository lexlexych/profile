    'prj.drafta.d':'SaaS for small and mid-sized businesses: AI drafts replies to customers across messengers and social networks, you just press Send.',
    'prj.drafta.lead':'drafta is a SaaS app that makes customer communication easier for small and mid-sized businesses. It takes over the job of an agent who runs the company’s social networks and messengers: it drafts replies and publishes content.',
    'prj.drafta.p0':'Customers message small businesses on Telegram, WhatsApp, Instagram, Facebook, by email and in the website chat. The owner keeps switching between apps and answers every message by hand, leaving no time for social media.',
    'prj.drafta.p1':'All channels connect to a single inbox. For every request, AI (Mistral, OpenAI) drafts a reply using the business context: calendar, spreadsheets and knowledge base. The same app lets you create posts and publish them straight to social networks. Stack: Next.js and Supabase.',
    'prj.drafta.p2':'The user only reviews the draft and presses one button to send it. The final decision always stays with a human, and conversations and posts across all channels are handled in one place.',
    'prj.drafta.s0':'The drafta app on a laptop and a phone: conversation list, chat and an AI reply draft',
    'prj.drafta.s1':'A WhatsApp conversation with a customer and a ready AI reply draft above the input field',
    'prj.drafta.s2':'Knowledge base settings: the categories AI pulls facts from and the token budget',
    'prj.drafta.s3':'drafta diagram: customer channels, business context and the owner making the final decision',
    'prj.mira.d':'An AI travel search assistant: tell the chat where you want to go and on what budget, and agents find matching flights and hotels.',
    'prj.mira.lead':'Mira is an AI chatbot for trip planning. The user describes in their own words where they want to go, how many people are travelling, the budget and any wishes, and AI agents search for matching flights and hotels.',
    'prj.mira.p0':'Planning a trip means hours of comparing flights and hotels across different websites, typing the same parameters into filters again and again and keeping all the options in your head.',
    'prj.mira.p1':'The logic runs on n8n: an orchestrator agent collects the trip parameters, asks for missing details and launches separate flight and hotel search agents. Models: OpenAI and Mistral. Answer quality is checked with automated evaluations on a test dataset. The chat UI is built with Next.js, data lives in Supabase, with HubSpot and Telegram integrations.',
    'prj.mira.p2':'A conversation instead of filters: the user gets up to five matching flight and hotel options with price, rating, conditions and a short explanation of why each one was chosen.',
    'prj.mira.s0':'Mira landing page: a sample trip conversation with the AI assistant',
    'prj.mira.s1':'Mira chat with flight results: price, outbound and return flights, baggage and conditions',
    'prj.mira.s2':'n8n workflow: orchestrator, flight and hotel search agents and a quality evaluation block',
    'prj.mira.s3':'Mira chat with hotel results: total price, rating, meals and conditions',
    'prj.fairplate.d':'A portal for Spirit GmbH: customers upload a packaging design and get the area per colour and the flexo plate price in a few clicks.',
    'prj.fairplate.lead':'Spirit FairPlate Shop is an online portal I built for Spirit GmbH, a maker of flexographic printing plates for corrugated board. The customer uploads a packaging design, and the system splits it into colours, measures the area of each colour and calculates the order price.',
    'prj.fairplate.p0':'The price of a flexo plate depends on the plate area needed for each colour of the design. Spirit\u2019s customers, packaging manufacturers, need that price fast to quote their own clients, while breaking down a design and measuring areas by hand takes time.',
    'prj.fairplate.p1':'A portal built with Next.js and TypeScript, with a PostgreSQL database on a self-hosted server. An uploaded design is automatically separated into colours, the area of each colour is calculated, and the price is derived from it. Calculations can be saved and ordered once the client confirms, and without registering you can upload a file or use sample data to get a demo calculation by email.',
    'prj.fairplate.p2':'A few clicks instead of a manual request: the customer uploads a product template and immediately gets a detailed breakdown of technical areas per colour and the order price.',
    'prj.fairplate.s0':'Spirit FairPlate Shop home page: ordering mounted and unmounted flexo plates online',
    'prj.fairplate.s1':'Calculator video guide: a finished price offer with the selected colours and the estimated cost',
    'prj.cards.d':'An AI assistant for sellers: turns an amateur product photo into a ready listing for Amazon, Etsy, eBay or Shopify.',
    'prj.cards.lead':'A chatbot that turns a raw product photo into a ready marketplace listing. Just send a snapshot, say a slightly creased dress lying on a bed, and the assistant generates professional photos, a product title and a description.',
    'prj.cards.p0':'To list a product on a marketplace, a seller needs good photos, a compelling title and a description with key features. A photo shoot with a model and copy tailored to every platform cost time and money, especially with many products.',
    'prj.cards.p1':'The user uploads a photo to the chat, and the assistant recognises the product, generates a set of images (on a clean background, in an interior and on a model \u201cwearing\u201d it) and writes a title, a description and a list of key features. Buttons choose the target platform (Amazon, Etsy, eBay, Shopify and others) and the language: English, German or Russian. Stack: React, Gemini models via API, hosted on Vercel.',
    'prj.cards.p2':'One amateur snapshot becomes a ready product listing in minutes: a set of photos, a title and a description that can be downloaded or edited before publishing.',
    'prj.cards.s0':'Etsy listing: model shots, a title and a description generated from a photo of a dress on a bed',
    'prj.cards.s1':'Amazon listing: a microwave oven with new photos and a list of key features',
    'prj.cards.s2':'Shopify listing: sneakers on a model in a casual city look',
    'prj.cards.s3':'eBay listing in Russian: a scooter with outdoor photos and specifications',
    'prj.oliva.d':'A voice assistant for a restaurant: answers calls, books tables and takes takeaway orders, handing complex questions to a staff member.',
    'prj.oliva.lead':'An AI voice assistant and portal for a restaurant. A guest calls the restaurant\u2019s regular number, and the assistant answers questions, books a table or takes a takeaway order. Everything it does goes straight into the restaurant portal, which is connected both to the assistant and to the website.',
    'prj.oliva.p0':'At peak times restaurant staff can\u2019t keep up with calls: guests can\u2019t get through to book a table or order food, and the restaurant loses orders. Bookings and orders also come from different channels (phone, website and on site) and have to be combined by hand.',
    'prj.oliva.p1':'The voice assistant takes calls on the restaurant\u2019s number: it answers guests\u2019 questions, books tables and takes takeaway orders. If it can\u2019t perform an action or answer a question, the call is transferred to a staff member. The second part of the project is the restaurant portal: a guest website with the menu, table booking and takeaway ordering, and a staff dashboard with a floor plan and real-time bookings and orders from all channels. Stack: LiveKit and ElevenLabs for voice, Next.js and PostgreSQL on a self-hosted server for the portal.',
    'prj.oliva.p2':'The restaurant answers every call, even when the staff are busy. Bookings and orders from the voice assistant, the website and the dining room come together in one place, and each entry shows which channel it came from.',
    'prj.oliva.s0':'How it works: a guest calls, the voice assistant answers questions, books a table or takes an order, and hands the call to a staff member when needed',
    'prj.oliva.s1':'Restaurant dashboard: floor plan and real-time orders tagged by channel: phone bot, website or restaurant',
    'prj.oliva.s2':'Table bookings: floor plan, a booking card from the Telegram bot and the list of upcoming bookings',
    'prj.oliva.s3':'Restaurant website for guests: menu, table booking and takeaway ordering',
    'prj.lingvy.d':'A German learning app built on books and films: reading with translation, audio retellings, a personal vocabulary list and word exercises.',
    'prj.lingvy.lead':'Lingvy is a Telegram Mini App for learning a foreign language through texts based on well-known books and films. The user reads and listens to stories, translates unfamiliar words, collects them in a personal vocabulary list and practises them in exercises.',
    'prj.lingvy.p0':'Textbooks and flashcard apps get boring fast: words are memorised out of context and forgotten just as quickly. The idea was to learn a language through engaging stories while training reading, listening and vocabulary at the same time.',
    'prj.lingvy.p1':'The app has a library of texts based on books and films, split into chapters. While reading, you can highlight a word or phrase, see its translation and add the word to your vocabulary list with one tap. Texts can be listened to as audio retellings, not just read, and the video section offers clips with German subtitles. Words from the list are practised in exercises: fill in the blank, listen and spell the word. Stack: a Telegram Mini App built with React, data in Supabase, hosted on Vercel.',
    'prj.lingvy.p2':'The user learns the language through stories they enjoy rather than isolated words. One app trains reading, listening and word retention, and the vocabulary grows right while reading.',
    'prj.lingvy.s0':'Lingvy on three screens: the book library, a chapter with a translated phrase and a word exercise',
    'prj.lingvy.s1':'Reading a chapter: a highlighted phrase with its Russian translation and the audio retelling player below',
    'prj.lingvy.s2':'Video section: short clips and videos with German subtitles',
    'prj.lingvy.s3':'Exercise: listen to a word and write it in German with its article',
    'prj.benefita.d':'A cooperative loyalty programme for local businesses: points earned at one venue are spent on discounts at others.',
    'prj.benefita.lead':'Benefita is a platform that brings local businesses together in a shared loyalty programme. Users earn points by completing tasks at some venues and spend them on discounts and gifts at others, while businesses gain new customers from their network partners without an advertising budget.',
    'prj.benefita.p0':'Small businesses struggle to attract new customers: advertising is expensive, and their own loyalty programme only keeps those who already came. A café, salon or workshop needs a way to get customers from nearby businesses and motivate them to come back.',
    'prj.benefita.p1':'Users find venues in the app\u2019s showcase and complete tasks for points. The simplest is to visit a venue and scan the NFC chip at the counter to check in. Other tasks include posting about the venue on social media, following an account, inviting a friend and turning on notifications. Points are exchanged for discounts and gifts offered by participating venues. Stack: Next.js, Supabase; the app runs as a PWA, with no app store install.',
    'prj.benefita.p2':'Customers of one venue discover others and come for their discounts, and every visit and social media post brings the business a new audience. For users it is a single bonus programme across the city instead of a dozen separate cards.',
    'prj.benefita.s0':'Benefita on a laptop and a phone: the business website and the venue showcase with offers',
    'prj.benefita.s1':'Points section: tasks for earning points (email, Instagram, notifications, inviting a friend, a post about a venue)',
    'prj.benefita.s2':'Showcase: participating venues and their discounts and gifts for points',
    'prj.benefita.s3':'Venue page: description, address, opening hours and available vouchers',

    'prj.drafta.d':'SaaS für kleine und mittlere Unternehmen: KI entwirft Antworten an Kunden in allen Messengern und sozialen Netzwerken, Sie klicken nur auf Senden.',
    'prj.drafta.lead':'drafta ist eine SaaS-App, die kleinen und mittleren Unternehmen die Kommunikation mit ihren Kunden erleichtert. Sie übernimmt die Aufgaben eines Agenten, der die sozialen Netzwerke und Messenger des Unternehmens betreut: Sie entwirft Antworten und veröffentlicht Inhalte.',
    'prj.drafta.p0':'Kunden schreiben kleinen Unternehmen über Telegram, WhatsApp, Instagram, Facebook, per E-Mail und im Website-Chat. Der Inhaber wechselt ständig zwischen Apps und beantwortet jede Nachricht von Hand, für Social Media bleibt keine Zeit.',
    'prj.drafta.p1':'Alle Kanäle laufen in einem Posteingang zusammen. Zu jeder Anfrage entwirft die KI (Mistral, OpenAI) eine Antwort mit dem Kontext des Unternehmens: Kalender, Tabellen und Wissensdatenbank. In derselben App lassen sich Beiträge erstellen und direkt in sozialen Netzwerken veröffentlichen. Stack: Next.js und Supabase.',
    'prj.drafta.p2':'Der Nutzer prüft den Entwurf und sendet ihn mit einem Klick. Die endgültige Entscheidung trifft immer ein Mensch, und Gespräche und Beiträge in allen Kanälen werden an einem Ort geführt.',
    'prj.drafta.s0':'Die App drafta auf Laptop und Smartphone: Dialogliste, Chat und ein KI-Antwortentwurf',
    'prj.drafta.s1':'Ein WhatsApp-Dialog mit einer Kundin und ein fertiger KI-Antwortentwurf über dem Eingabefeld',
    'prj.drafta.s2':'Einstellungen der Wissensdatenbank: Kategorien, aus denen die KI Fakten bezieht, und das Token-Budget',
    'prj.drafta.s3':'drafta-Schema: Kundenkanäle, Unternehmenskontext und die endgültige Entscheidung beim Inhaber',
    'prj.mira.d':'KI-Assistent für die Reisesuche: Sie schreiben im Chat, wohin und mit welchem Budget Sie reisen möchten, und Agenten finden passende Flüge und Hotels.',
    'prj.mira.lead':'Mira ist ein KI-Chatbot für die Reiseplanung. Der Nutzer beschreibt in eigenen Worten, wohin er reisen möchte, mit wie vielen Personen, mit welchem Budget und welchen Wünschen, und KI-Agenten suchen passende Flüge und Hotels.',
    'prj.mira.p0':'Eine Reise zu planen heißt, stundenlang Flüge und Hotels auf verschiedenen Websites zu vergleichen, immer wieder dieselben Filter auszufüllen und alle Optionen im Kopf zu behalten.',
    'prj.mira.p1':'Die Logik läuft in n8n: Ein Orchestrator-Agent sammelt die Reiseparameter, fragt fehlende Angaben nach und startet eigene Agenten für die Flug- und Hotelsuche. Modelle: OpenAI und Mistral. Die Qualität der Antworten wird mit automatischen Evaluierungen auf einem Testdatensatz geprüft. Die Chat-Oberfläche ist mit Next.js gebaut, die Daten liegen in Supabase, dazu Integrationen mit HubSpot und Telegram.',
    'prj.mira.p2':'Ein Gespräch statt Filter: Der Nutzer erhält bis zu fünf passende Flug- und Hoteloptionen mit Preis, Bewertung, Konditionen und einer kurzen Begründung, warum gerade diese Option gewählt wurde.',
    'prj.mira.s0':'Mira-Landingpage: ein Beispieldialog mit dem KI-Assistenten über eine Reise',
    'prj.mira.s1':'Mira-Chat mit gefundenen Flügen: Preis, Hin- und Rückflug, Gepäck und Konditionen',
    'prj.mira.s2':'n8n-Workflow: Orchestrator, Agenten für Flug- und Hotelsuche und ein Block zur Qualitätsbewertung',
    'prj.mira.s3':'Mira-Chat mit gefundenen Hotels: Gesamtpreis, Bewertung, Verpflegung und Konditionen',
    'prj.fairplate.d':'Portal für die Spirit GmbH: Kunden laden ein Verpackungsmotiv hoch und erhalten mit wenigen Klicks die Flächen je Farbe und den Klischeepreis.',
    'prj.fairplate.lead':'Der Spirit FairPlate Shop ist ein Onlineportal, das ich im Auftrag der Spirit GmbH entwickelt habe, einem Hersteller von Flexoklischees für den Wellpappendruck. Der Kunde lädt ein Verpackungsmotiv hoch, und das System zerlegt es in Farben, berechnet die Fläche jeder Farbe und ermittelt den Auftragspreis.',
    'prj.fairplate.p0':'Der Preis eines Flexoklischees hängt von der Druckfläche für jede Farbe des Motivs ab. Die Kunden von Spirit, Verpackungshersteller, brauchen diesen Preis schnell, um ihren eigenen Auftraggebern ein Angebot zu machen, doch ein Motiv manuell zu zerlegen und Flächen zu messen dauert.',
    'prj.fairplate.p1':'Ein Portal mit Next.js und TypeScript und einer PostgreSQL-Datenbank auf einem eigenen Server. Ein hochgeladenes Motiv wird automatisch in Farben getrennt, für jede Farbe wird die Fläche berechnet und daraus der Preis ermittelt. Kalkulationen lassen sich speichern und bestellen, sobald der Auftraggeber zusagt; ohne Registrierung kann man eine Datei hochladen oder Testdaten nutzen und erhält eine Demo-Kalkulation per E-Mail.',
    'prj.fairplate.p2':'Wenige Klicks statt einer manuellen Anfrage: Der Kunde lädt eine Produktvorlage hoch und erhält sofort eine detaillierte Aufschlüsselung der technischen Flächen je Farbe und den Auftragspreis.',
    'prj.fairplate.s0':'Startseite des Spirit FairPlate Shops: montierte und unmontierte Flexoklischees online bestellen',
    'prj.fairplate.s1':'Videoanleitung zum Kalkulator: ein fertiges Preisangebot mit den ausgewählten Farben und den geschätzten Kosten',
    'prj.cards.d':'KI-Assistent für Händler: macht aus einem Amateurfoto eines Produkts ein fertiges Angebot für Amazon, Etsy, eBay oder Shopify.',
    'prj.cards.lead':'Ein Chatbot, der aus einem rohen Produktfoto ein fertiges Marktplatz-Angebot macht. Ein Schnappschuss genügt, etwa ein leicht zerknittertes Kleid auf dem Bett, und der Assistent erzeugt professionelle Fotos, einen Produkttitel und eine Beschreibung.',
    'prj.cards.p0':'Um ein Produkt auf einem Marktplatz einzustellen, braucht ein Händler gute Fotos, einen überzeugenden Titel und eine Beschreibung mit den wichtigsten Merkmalen. Ein Fotoshooting mit Model und Texte für jede Plattform kosten Zeit und Geld, besonders bei vielen Produkten.',
    'prj.cards.p1':'Der Nutzer lädt ein Foto in den Chat, und der Assistent erkennt das Produkt, erzeugt eine Bildserie (vor neutralem Hintergrund, im Interieur und an einem Model, das es \u201eanprobiert\u201c) und schreibt Titel, Beschreibung und eine Liste der wichtigsten Merkmale. Per Button wählt man die Zielplattform (Amazon, Etsy, eBay, Shopify und weitere) und die Sprache: Englisch, Deutsch oder Russisch. Stack: React, Gemini-Modelle per API, Hosting auf Vercel.',
    'prj.cards.p2':'Aus einem einzigen Amateurfoto entsteht in wenigen Minuten ein fertiges Produktangebot: Fotos, Titel und Beschreibung, die sich herunterladen oder vor der Veröffentlichung bearbeiten lassen.',
    'prj.cards.s0':'Etsy-Angebot: Modelfotos, Titel und Beschreibung, erzeugt aus einem Foto eines Kleides auf dem Bett',
    'prj.cards.s1':'Amazon-Angebot: eine Mikrowelle mit neuen Fotos und einer Liste der wichtigsten Merkmale',
    'prj.cards.s2':'Shopify-Angebot: Sneaker an einem Model im lässigen Stadtlook',
    'prj.cards.s3':'eBay-Angebot auf Russisch: ein Motorroller mit Fotos im Freien und technischen Daten',
    'prj.oliva.d':'Sprachassistent für ein Restaurant: nimmt Anrufe an, reserviert Tische und nimmt Bestellungen zur Abholung auf, komplexe Fragen gehen an einen Mitarbeiter.',
    'prj.oliva.lead':'Ein KI-Sprachassistent und Portal für ein Restaurant. Ein Gast ruft die normale Nummer des Restaurants an, und der Assistent beantwortet Fragen, reserviert einen Tisch oder nimmt eine Bestellung zur Abholung auf. Alles, was er tut, landet direkt im Restaurantportal, das sowohl mit dem Assistenten als auch mit der Website verbunden ist.',
    'prj.oliva.p0':'Zu Stoßzeiten kommt das Personal mit den Anrufen nicht hinterher: Gäste erreichen niemanden, um einen Tisch zu reservieren oder Essen zu bestellen, und das Restaurant verliert Bestellungen. Reservierungen und Bestellungen kommen zudem über verschiedene Kanäle (Telefon, Website und vor Ort) und müssen von Hand zusammengeführt werden.',
    'prj.oliva.p1':'Der Sprachassistent nimmt Anrufe unter der Nummer des Restaurants an: Er beantwortet Fragen der Gäste, reserviert Tische und nimmt Bestellungen zur Abholung auf. Kann er eine Aktion nicht ausführen oder eine Frage nicht beantworten, wird der Anruf an einen Mitarbeiter weitergeleitet. Der zweite Teil des Projekts ist das Restaurantportal: eine Website für Gäste mit Speisekarte, Tischreservierung und Bestellung zur Abholung sowie ein Dashboard für das Personal mit Saalplan und Reservierungen und Bestellungen aus allen Kanälen in Echtzeit. Stack: LiveKit und ElevenLabs für die Sprache, Next.js und PostgreSQL auf einem eigenen Server für das Portal.',
    'prj.oliva.p2':'Das Restaurant nimmt jeden Anruf an, auch wenn das Personal beschäftigt ist. Reservierungen und Bestellungen vom Sprachassistenten, von der Website und aus dem Restaurant laufen an einem Ort zusammen, und bei jedem Eintrag ist zu sehen, über welchen Kanal er kam.',
    'prj.oliva.s0':'Ablauf: Ein Gast ruft an, der Sprachassistent beantwortet Fragen, reserviert einen Tisch oder nimmt eine Bestellung auf und übergibt bei Bedarf an einen Mitarbeiter',
    'prj.oliva.s1':'Restaurant-Dashboard: Saalplan und Bestellungen in Echtzeit, markiert nach Kanal: Telefon-Bot, Website oder Restaurant',
    'prj.oliva.s2':'Tischreservierungen: Saalplan, eine Reservierung über den Telegram-Bot und die Liste anstehender Reservierungen',
    'prj.oliva.s3':'Restaurant-Website für Gäste: Speisekarte, Tischreservierung und Bestellung zur Abholung',
    'prj.lingvy.d':'App zum Deutschlernen mit Büchern und Filmen: Lesen mit Übersetzung, Audio-Nacherzählungen, ein persönliches Vokabelheft und Wortübungen.',
    'prj.lingvy.lead':'Lingvy ist eine Telegram Mini App zum Lernen einer Fremdsprache mit Texten nach bekannten Büchern und Filmen. Der Nutzer liest und hört Geschichten, übersetzt unbekannte Wörter, sammelt sie in einem persönlichen Vokabelheft und festigt sie in Übungen.',
    'prj.lingvy.p0':'Lehrbücher und Karteikarten-Apps werden schnell langweilig: Wörter werden ohne Kontext gelernt und ebenso schnell vergessen. Die Idee war, eine Sprache mit spannenden Geschichten zu lernen und dabei Lesen, Hörverstehen und Wortschatz zugleich zu trainieren.',
    'prj.lingvy.p1':'Die App bietet eine Bibliothek mit Texten nach Büchern und Filmen, aufgeteilt in Kapitel. Beim Lesen lässt sich ein Wort oder eine Phrase markieren, die Übersetzung anzeigen und das Wort mit einem Tippen ins Vokabelheft übernehmen. Texte kann man nicht nur lesen, sondern auch als Audio-Nacherzählung hören, und im Videobereich gibt es Clips mit deutschen Untertiteln. Wörter aus dem Vokabelheft werden in Übungen gefestigt: Lücken füllen, anhören und schreiben. Stack: Telegram Mini App mit React, Daten in Supabase, Hosting auf Vercel.',
    'prj.lingvy.p2':'Der Nutzer lernt die Sprache mit Geschichten, die ihn interessieren, statt mit einzelnen Wörtern. Eine App trainiert Lesen, Hörverstehen und das Behalten von Wörtern, und der Wortschatz wächst direkt beim Lesen.',
    'prj.lingvy.s0':'Lingvy auf drei Bildschirmen: Buchbibliothek, ein Kapitel mit übersetzter Phrase und eine Wortübung',
    'prj.lingvy.s1':'Lesen eines Kapitels: eine markierte Phrase mit russischer Übersetzung, darunter der Player für die Audio-Nacherzählung',
    'prj.lingvy.s2':'Videobereich: kurze Clips und Videos mit deutschen Untertiteln',
    'prj.lingvy.s3':'Übung: ein Wort anhören und es auf Deutsch mit Artikel schreiben',
    'prj.benefita.d':'Kooperatives Treueprogramm für lokale Betriebe: In einem Betrieb gesammelte Punkte werden bei anderen gegen Rabatte eingelöst.',
    'prj.benefita.lead':'Benefita ist eine Plattform, die lokale Betriebe in einem gemeinsamen Treueprogramm verbindet. Nutzer sammeln Punkte mit Aufgaben in einigen Betrieben und lösen sie bei anderen gegen Rabatte und Geschenke ein, und die Betriebe gewinnen ohne Werbebudget neue Kunden von ihren Netzwerkpartnern.',
    'prj.benefita.p0':'Kleine Betriebe tun sich schwer, neue Kunden zu gewinnen: Werbung ist teuer, und ein eigenes Treueprogramm hält nur die, die schon da waren. Ein Café, ein Salon oder eine Werkstatt braucht einen Weg, Kunden von benachbarten Betrieben zu gewinnen und zum Wiederkommen zu motivieren.',
    'prj.benefita.p1':'Nutzer finden Betriebe in der Vitrine der App und erledigen Aufgaben für Punkte. Die einfachste: den Betrieb besuchen und den NFC-Chip an der Theke scannen, um den Besuch zu bestätigen. Weitere Aufgaben sind etwa ein Beitrag über den Betrieb in sozialen Netzwerken, einem Account folgen, Freunde einladen oder Benachrichtigungen aktivieren. Die Punkte werden gegen Rabatte und Geschenke der teilnehmenden Betriebe eingetauscht. Stack: Next.js, Supabase; die App läuft als PWA, ohne Installation aus dem App Store.',
    'prj.benefita.p2':'Kunden eines Betriebs entdecken andere und kommen für deren Rabatte vorbei, und jeder Besuch und jeder Social-Media-Beitrag bringt dem Betrieb neues Publikum. Für Nutzer ist es ein Bonusprogramm für die ganze Stadt statt einem Dutzend einzelner Karten.',
    'prj.benefita.s0':'Benefita auf Laptop und Smartphone: die Website für Betriebe und die Vitrine mit Angeboten',

const LANGS = ['de', 'en', 'ru'];
let LANG = (() => {
  try { const s = localStorage.getItem('pf-lang'); if (LANGS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : 'en';
})();

/* ================= GEAR GEOMETRY ================= */
function gearPath(teeth, pitchR, holeR = 0, depth = null) {
  const m = depth ?? (2 * pitchR / teeth);
  const ro = pitchR + m * 0.9, rr = pitchR - m * 1.1, s = Math.PI * 2 / teeth;
  let d = '';
  for (let i = 0; i < teeth; i++) {
    const a = i * s;
    const pts = [[rr, a - s * .5], [rr, a - s * .26], [ro, a - s * .13], [ro, a + s * .13], [rr, a + s * .26]];
    pts.forEach(([r, t], k) => { d += (i === 0 && k === 0 ? 'M' : 'L') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2) + ' '; });
  }
  d += 'Z ';
  if (holeR > 0) d += `M${holeR} 0 A${holeR} ${holeR} 0 1 0 ${-holeR} 0 A${holeR} ${holeR} 0 1 0 ${holeR} 0 Z`;
  return d;
}

  if (svg.hasAttribute('data-spin')) { g.dataset.spin = svg.dataset.spin; svg.removeAttribute('data-spin'); }

});

/* ================= SPIN ENGINE ================= */
let gSpeed = 1, gTarget = 1;
const spinners = [];
function registerSpinners(root = document) {
  $$('[data-spin]', root).forEach(el => {
    if (el._sp) return;
    const s = { el, speed: parseFloat(el.dataset.spin) || 0, angle: rand(0, 360), local: 1, localT: 1, extra: 0, extraT: 0 };
    el._sp = s;
    if (el instanceof SVGElement && el.tagName !== 'svg') { el.style.transformBox = 'view-box'; el.style.transformOrigin = '0 0'; }
    const host = s.host = el.closest('[data-spinhost]');
    if (host && !host._spBound) {
      host._spBound = true;
      host.addEventListener('mouseenter', () => $$('[data-spin]', host).forEach(e => e._sp && (e._sp.localT = 6)));
      host.addEventListener('mouseleave', () => $$('[data-spin]', host).forEach(e => e._sp && (e._sp.localT = 1)));
    }
    spinners.push(s);
  });
}
function kick(el, deg) { if (el && el._sp) el._sp.extraT += deg; }
function boost(dir) { gTarget = 11 * dir; }

/* ================= BACKGROUND GEARS ================= */
const gearSvg = $('#gears');
let clusters = [], baseAngle = 0;
function buildGears() {
  const w = innerWidth, h = innerHeight;
  gearSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  gearSvg.innerHTML = '';
  const mk = w < 700 ? .55 : 1;
  const defs = [
    { x: w * .03, y: h * .96, m: 8 * mk, cls: 'gear', chain: [[40, 0], [20, -38], [13, -95], [24, -20]] },
    { x: w * .985, y: h * .08, m: 7 * mk, cls: 'gear gear-v', chain: [[36, 0], [18, 150], [26, 205]] },
  ];
  clusters = defs.map(def => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    gearSvg.appendChild(g);
    const gears = [];
    def.chain.forEach(([teeth, dirDeg], i) => {
      const r = def.m * teeth / 2;
      let x = def.x, y = def.y, ratio = 1, phase = 0, parent = gears[i - 1];
      if (parent) {
        const th = dirDeg * Math.PI / 180, dist = parent.r + r;
        x = parent.x + Math.cos(th) * dist; y = parent.y + Math.sin(th) * dist;
        ratio = -parent.ratio * parent.teeth / teeth;
        // meshing phase: child = θ+180 − (t1/t2)(parentPhase − θ) + 180/t2
        phase = dirDeg + 180 - (parent.teeth / teeth) * (parent.phase - dirDeg) + 180 / teeth;
      }
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const hole = r * .28;
      el.innerHTML = `<path class="${def.cls}" d="${gearPath(teeth, r, hole, def.m)}" fill-rule="evenodd"/>
        <circle class="deco" r="${(r * .72).toFixed(1)}"/><circle class="deco-d" r="${(r * .52).toFixed(1)}"/>
        ${teeth > 16 ? [0, 1, 2, 3, 4, 5].map(k => { const a = k * Math.PI / 3, rr = r * .52; return `<circle class="deco" cx="${(Math.cos(a) * rr).toFixed(1)}" cy="${(Math.sin(a) * rr).toFixed(1)}" r="${(r * .09).toFixed(1)}"/>`; }).join('') : ''}`;
      g.appendChild(el);
      gears.push({ el, x, y, r, teeth, ratio, phase });
    });
    return { g, gears, px: 0, py: 0, depth: def === defs[0] ? 14 : -10 };
  });
}

/* ================= CIRCUITS ================= */
function buildCircuits() {
  const svg = $('#circuits'), w = innerWidth, h = innerHeight, G = 28;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let out = '';
  const count = w < 700 ? 8 : 16;
  for (let k = 0; k < count; k++) {
    const side = k % 4;
    let x, y, dx = 0, dy = 0;
    if (side === 0) { x = 0; y = Math.round(rand(.15, .95) * h / G) * G; dx = 1; }
    else if (side === 1) { x = w; y = Math.round(rand(.15, .95) * h / G) * G; dx = -1; }
    else if (side === 2) { y = h; x = Math.round(rand(.05, .95) * w / G) * G; dy = -1; }
    else { y = 0; x = Math.round(rand(.05, .95) * w / G) * G; dy = 1; }
    let d = `M${x} ${y}`;
    const segs = ri(2, 4);
    for (let s = 0; s < segs; s++) {
      const len = G * ri(2, 6); x += dx * len; y += dy * len; d += ` L${x} ${y}`;
      if (Math.random() < .7) {
        const nx = dx || (Math.random() < .5 ? 1 : -1), ny = dy || (Math.random() < .5 ? 1 : -1), dl = G * ri(1, 2);
        x += nx * dl; y += ny * dl; d += ` L${x} ${y}`;
      }
    }
    out += `<path class="trace" d="${d}"/><path class="pulse" d="${d}" data-p/><circle class="via" cx="${x}" cy="${y}" r="4"/>`;
  }
  svg.innerHTML = out;
  $$('.pulse', svg).forEach(p => {
    const L = Math.ceil(p.getTotalLength());
    p.style.setProperty('--len', L);
    p.style.setProperty('--dur', (L / rand(45, 85)).toFixed(2) + 's');
    p.style.setProperty('--del', (-rand(0, 8)).toFixed(2) + 's');
  });
}

/* ================= BINARY FIELD ================= */
const cvs = $('#binary'), ctx = cvs.getContext('2d');
let cols = [], bitRGB = '92,199,176', dpr = 1;
function readTheme() { bitRGB = getComputedStyle(document.documentElement).getPropertyValue('--bit').trim() || bitRGB; kgTheme(); }
function buildBinary() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = [];
  const step = 26;
  for (let x = 8; x < innerWidth; x += step) {
    if (Math.random() < .45) continue;
    const len = ri(6, 18);
    cols.push({ x, y: rand(-innerHeight, innerHeight), v: rand(.25, .9), len, chars: Array.from({ length: len }, () => Math.random() < .5 ? '0' : '1') });
  }
}
let mouse = { x: innerWidth / 2, y: innerHeight / 2, nx: 0, ny: 0 };
function drawBinary(dt) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.font = '600 13px "JetBrains Mono", monospace';
  const sp = Math.abs(gSpeed);
  for (const c of cols) {
    c.y += c.v * dt * .06 * (0.6 + sp * .9);
    if (c.y - c.len * 17 > innerHeight) { c.y = -rand(20, 300); }
    if (Math.random() < .02 * sp) c.chars[ri(0, c.len - 1)] = Math.random() < .5 ? '0' : '1';
    for (let i = 0; i < c.len; i++) {
      const y = c.y - i * 17;
      if (y < -20 || y > innerHeight + 20) continue;
      const dxm = c.x - mouse.x, dym = y - mouse.y, near = Math.max(0, 1 - Math.hypot(dxm, dym) / 170);
      let a = (1 - i / c.len) * .22 + near * .4 + (sp > 2 ? .15 : 0);
      if (i === 0) a += .25;
      ctx.fillStyle = `rgba(${bitRGB},${Math.min(a, 1).toFixed(3)})`;
      ctx.fillText(c.chars[i], c.x, y);
    }
  }

}

$$('[data-legal]').forEach(b => b.addEventListener('click', () => openLegal(b.dataset.legal, b)));
$$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.closest('.modal'))));

let pmIdx = 0, tabIdx = 0;
function fillProject(i) {
  const p = PROJECTS[i]; pmIdx = i;
  $('#pmMeta').textContent = `${p.id} · ${p.catName}`;
  $('#pmTitle').textContent = p.title;
  const scr = $('#pmScreen');
  scr.innerHTML = mediaHTML(p, true); playAnims(scr);
  scr.style.aspectRatio = p.shots ? `${p.shots[0].w} / ${p.shots[0].h}` : '';
  scr.classList.toggle('real', !!p.shots);
  $('#pmThumbs').innerHTML = (p.shots ? p.shots.map((sh, k) => shotHTML(p, k, true)) : [0, 1, 2, 3].map(() => `<div class="ph-media">${ICON_IMG}</div>`))
    .map((m, k) => `<button class="${k === 0 ? 'active' : ''}" aria-label="${t('proj.frame')} ${k + 1}">${m}</button>`).join('');
  $$('#pmThumbs button').forEach((b, k) => b.addEventListener('click', () => {
    $$('#pmThumbs button').forEach(x => x.classList.remove('active')); b.classList.add('active');
    if (p.shots) { scr.innerHTML = shotHTML(p, k); playAnims(scr); scr.style.aspectRatio = `${p.shots[k].w} / ${p.shots[k].h}`; }
  }));
  // тексты: у настоящего проекта свои ключи, у тестового — общие заглушки
  $('#pmLead').dataset.i18n = p.key ? `prj.${p.key}.lead` : 'pm.lead';
  $$('#tabTrack > div').forEach((d, k) => d.dataset.i18n = p.key ? `prj.${p.key}.p${k}` : `pm.p${k}`);
  i18nIn($('.m-info', pm));
  // у настоящего проекта нет метрик и демо/кода: показываем только ссылку, если она есть
  $('#pmMetrics').hidden = !!p.key;
  $('#pmLinks').hidden = !!p.key && !p.url;
  $$('#pmLinks [data-ph]').forEach(b => b.hidden = !!p.key);
  const site = $('#pmSite');
  site.hidden = !p.url;
  if (p.url) site.href = p.url; else site.removeAttribute('href');
  $('#pmTags').innerHTML = p.tags.map(t => `<span>${esc(t)}</span>`).join('');
  $('#pmStack').hidden = !p.tags.length;
  setTab(0);
}
function openProject(i) { fillProject(i); openModal(pm, pcards[i]); }
function pmStep(d) {
  const i = (pmIdx + d + PROJECTS.length) % PROJECTS.length;
  const body = $('.m-body', pm);
  body.style.transition = 'opacity .25s, transform .25s'; body.style.opacity = 0; body.style.transform = `translateX(${-d * 30}px)`;
  kick($('.m-head .gear-sm g', pm), d * 180);
  setTimeout(() => {
    fillProject(i); carTo(i); modalSource = pcards[i];
    body.style.transition = 'none'; body.style.transform = `translateX(${d * 30}px)`; body.offsetWidth;
    body.style.transition = 'opacity .35s, transform .45s var(--ease-out)'; body.style.opacity = 1; body.style.transform = '';
  }, 250);
}
$('#pmPrev').addEventListener('click', () => pmStep(-1));
$('#pmNext').addEventListener('click', () => pmStep(1));
const tabBtns = $$('#tabs button');
function setTab(k) {
  tabIdx = k;
  tabBtns.forEach((b, j) => b.classList.toggle('active', j === k));
  $('#tabs .ind').style.transform = `translateX(${k * 100}%)`;
  $('#tabTrack').style.transform = `translateX(${-k * 100}%)`;
}
tabBtns.forEach((b, k) => b.addEventListener('click', () => setTab(k)));

function openCert(i, srcEl) {
  const c = CERTS[i];
  $('#cmMeta').textContent = `${c.id} · ${c.org} · ${c.dateStr}`;
  $('#cmTitle').textContent = c.title;
  const big = $('#cmBig');
  let h = Math.min(innerHeight * .72, 760, innerWidth * .82 / c.ratio), w = h * c.ratio;
  big.style.width = w + 'px'; big.style.height = h + 'px';
  big.innerHTML = certImg(c).replace('alt=""', `alt="${c.title}"`);
  openModal(cm, srcEl);
}

/* ================= FORM ================= */
const form = $('#form'), tx = $('#tx');
form.addEventListener('submit', e => {
  e.preventDefault();
  const checks = [['#fMail', v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())], ['#fName', v => v.trim().length > 1], ['#fMsg', v => v.trim().length > 1], ['#fConsent', (v, el) => el.checked]];
  let ok = true;
  checks.forEach(([s, fn]) => {
    const f = $(s).closest('.field'), bad = !fn($(s).value, $(s)); f.classList.remove('err');
    $(s).setAttribute('aria-invalid', bad);
    if (bad) { void f.offsetWidth; f.classList.add('err'); ok = false; }
  });
  if (!ok) { txState = 'fix'; $('#txStatus').textContent = t('f.fix'); return; }
  const btn = $('#send'); if (btn.classList.contains('sending')) return;
  txState = 'ready';
  btn.classList.add('sending');
  gTarget = 6;
  // Анимация идёт не меньше 2 с и замирает на 95%, пока не придёт ответ /api/contact.
  let result = null;
  fetch('/api/contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.fromEntries(new FormData(form))),
  }).then(r => r.ok).catch(() => false).then(v => { result = v; });
  const t0 = performance.now();
  (function f(now) {
    const p = Math.min(result === null ? .95 : 1, (now - t0) / 2000);
    if (p >= 1 && !result) {
      txState = 'err'; btn.classList.remove('sending');
      $('#sendTxt').textContent = t('f.send'); $('#txStatus').textContent = t('f.err');
      return;
    }
    const bits = Array.from({ length: 8 }, () => Math.random() < .5 ? 0 : 1).join('');
    if (p >= 1) txState = 'done';
    $('#sendTxt').textContent = p < 1 ? `${bits} · ${t('f.sending')} ${Math.round(p * 100)}%` : t('f.sent');
    $('#txStatus').textContent = p < 1 ? t('f.tx') : t('f.delivered');
    if (p < 1) requestAnimationFrame(f);
    else setTimeout(() => { tx.classList.add('done'); boost(3); }, 250);
  })(t0);
});
$$('#form input, #form textarea').forEach(i => i.addEventListener('input', () => { i.closest('.field')?.classList.remove('err'); i.removeAttribute('aria-invalid'); }));
$('#again').addEventListener('click', () => {
  tx.classList.remove('done'); form.reset(); txState = 'ready';
  const btn = $('#send'); btn.classList.remove('sending'); $('#sendTxt').textContent = t('f.send');
  $('#txStatus').textContent = t('f.ready');
});

/* ================= CURSOR ================= */
if (matchMedia('(pointer:fine)').matches) {
  const cur = $('#cursor'), dot = $('#cDot'), ring = $('#cRingW');
  let rx = 0, ry = 0;
  addEventListener('pointermove', e => { cur.classList.add('live'); mouse.x = e.clientX; mouse.y = e.clientY; dot.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; });
  (function follow() { rx += (mouse.x - rx) * .18; ry += (mouse.y - ry) * .18; ring.style.transform = `translate(${rx.toFixed(1)}px,${ry.toFixed(1)}px)`; requestAnimationFrame(follow); })();
  document.addEventListener('pointerover', e => {
    const own = !!e.target.closest('.hero-play'); // the hero play button shows the plain system pointer instead
    cur.classList.toggle('off', own);
    cur.classList.toggle('hover', !own && !!e.target.closest('a,button,label,.pcard,.cert,.chip,input[type=range]'));
  });
  addEventListener('pointerdown', () => cur.classList.add('down'));
  addEventListener('pointerup', () => cur.classList.remove('down'));
} else {
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
}

/* ================= LANGUAGE ================= */
function i18nIn(root = document) {
  $$('[data-i18n]', root).forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-aria]', root).forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('[data-i18n-ph]', root).forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  $$('[data-i18n-alt]', root).forEach(el => el.setAttribute('alt', t(el.dataset.i18nAlt)));
}
let txState = 'ready';
function applyLang(l, animate) {
  LANG = l;
  document.documentElement.lang = l;
  try { localStorage.setItem('pf-lang', l); } catch (e) {}
  $$('#lang [data-lang]').forEach(b => b.setAttribute('aria-checked', b.dataset.lang === l));
  $('#langVal').textContent = l.toUpperCase();
  $$('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (el.textContent === v) return;
    if (animate && v.length <= 42) scrambleText(el, v, 520);
    else {
      el.textContent = v;
      if (animate) { el.classList.remove('fx-swap'); void el.offsetWidth; el.classList.add('fx-swap'); }
    }
  });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  $$('[data-i18n-alt]').forEach(el => el.setAttribute('alt', t(el.dataset.i18nAlt)));
  // dynamic bits
  $$('#hudR button').forEach((b, i) => b.setAttribute('aria-label', t('nav.' + i)));
  $('#navVal').textContent = t('nav.' + current);
  setPager(current);
  dots.forEach((d, i) => d.setAttribute('aria-label', t('proj.n') + ' ' + (i + 1)));
  pcards.forEach((c, i) => c.setAttribute('aria-label', PROJECTS[i].title));
  CERTS.forEach(c => c._el && c._el.setAttribute('aria-label', t('cert.open') + ': ' + c.title));
  selectCert(activeCert, !animate);
  kgLang();
  $('#txStatus').textContent = t(txState === 'done' ? 'f.delivered' : txState === 'fix' ? 'f.fix' : txState === 'err' ? 'f.err' : 'f.ready');
  if (!$('#send').classList.contains('sending')) $('#sendTxt').textContent = t('f.send');
  else if (txState === 'done') $('#sendTxt').textContent = t('f.sent');
  if (pm.classList.contains('show')) { $('#pmMeta').textContent = `${PROJECTS[pmIdx].id} · ${PROJECTS[pmIdx].catName}`; $('#pmTitle').textContent = PROJECTS[pmIdx].title; }
  if (cm.classList.contains('show')) { const c = CERTS[activeCert]; $('#cmMeta').textContent = `${c.id} · ${c.org} · ${c.dateStr}`; $('#cmTitle').textContent = c.title; $('.cert-img', cm)?.setAttribute('alt', c.title); }
  setTimeout(() => placeMenuThumb(current), animate ? 560 : 0);
}
$$('#lang [data-lang]').forEach(b => b.addEventListener('click', () => {
  ddClose(true);
  if (b.dataset.lang === LANG) return;
  boost(LANGS.indexOf(b.dataset.lang) > LANGS.indexOf(LANG) ? 4 : -4);
  applyLang(b.dataset.lang, true);
}));

/* ================= PREFS DROPDOWNS ================= */
let ddCur = null;
function ddOpen(dd, focusItem) {
  if (ddCur && ddCur !== dd) ddClose();
  ddCur = dd; dd.classList.add('open');
  $('.dd-btn', dd).setAttribute('aria-expanded', true);
  if (focusItem) ($('[aria-checked="true"]', dd) || $('.dd-menu button', dd)).focus();
}
function ddClose(refocus) {
  if (!ddCur) return;
  const dd = ddCur; ddCur = null;
  dd.classList.remove('open');
  $('.dd-btn', dd).setAttribute('aria-expanded', false);
  if (refocus) $('.dd-btn', dd).focus();
}
$$('.dd').forEach(dd => {
  // e.detail === 0: opened from the keyboard, so move focus into the menu
  $('.dd-btn', dd).addEventListener('click', e => { ddCur === dd ? ddClose() : ddOpen(dd, e.detail === 0); });
  // keys stay inside the menu so they never flip slides
  dd.addEventListener('keydown', e => {
    const items = $$('.dd-menu button', dd), i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { if (ddCur !== dd) return; ddClose(true); }
    else if (e.key === 'Tab') { ddClose(); return; }
    else if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      if (ddCur !== dd) ddOpen(dd, true);
      else {
        const n = items.length, j = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
        items[j].focus();
      }
    } else return;
    e.preventDefault(); e.stopPropagation();
  });
});
document.addEventListener('pointerdown', e => { if (ddCur && !ddCur.contains(e.target)) ddClose(); });
$$('#navDd [data-go]').forEach(b => b.addEventListener('click', () => ddClose(true)));

/* ================= THEME ================= */
function applyTheme(m) {
  if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
  else { m = 'system'; delete document.documentElement.dataset.theme; }
  try { localStorage.setItem('pf-theme', m); } catch (e) {}
  $$('#theme [data-theme-opt]').forEach(b => {
    const on = b.dataset.themeOpt === m;
    b.setAttribute('aria-checked', on);
    if (on) $('#themeVal').replaceChildren($('svg', b).cloneNode(true));
  });
}
$$('#theme [data-theme-opt]').forEach(b => b.addEventListener('click', () => { ddClose(true); applyTheme(b.dataset.themeOpt); }));
applyTheme(document.documentElement.dataset.theme || 'system');

/* ================= INIT ================= */
function buildAll() { buildGears(); buildCircuits(); buildBinary(); layoutCerts(); placeMenuThumb(current, true); layoutCar(); kgResize(); }
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(buildAll, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => setTimeout(readTheme, 50));
new MutationObserver(() => setTimeout(readTheme, 50)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

readTheme();
buildCerts();
applyLang(LANG, false);
registerSpinners();
buildGears(); buildCircuits(); buildBinary();

const fromHash = slides.findIndex(s => '#' + s.id === location.hash);
current = fromHash >= 0 ? fromHash : 0;
slides[current].classList.add('active');
setActiveUI(current);
requestAnimationFrame(() => { placeMenuThumb(current, true); layoutCerts(); });
document.fonts?.ready.then(() => { placeMenuThumb(current, true); layoutCerts(); KN.nodes.forEach(n => n.w = {}); });
requestAnimationFrame(loop);

// boot sequence: shutters start closed, then open
prepShutter(current);
$$('.sh-label .w', shutter).forEach(e => e.textContent = t('sh.boot'));
$$('.sh-label .k', shutter).forEach(e => e.textContent = t('sh.init'));
$$('.sh-sub', shutter).forEach(e => e.textContent = t('sh.bootSub'));
busy = true;
boost(1);
setTimeout(() => {
  shutter.classList.remove('boot'); void shutter.offsetWidth;
  shutter.classList.add('opening'); boost(8);
  setTimeout(() => enterSlide(current), 200);
  setTimeout(() => { shutter.classList.remove('opening'); busy = false; }, 850);
}, RM ? 50 : 1250);
})();
</script>
